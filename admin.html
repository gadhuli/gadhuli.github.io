<style>
*{box-sizing:border-box;margin:0;padding:0}

.header-title{font-size:21px;font-weight:800;color:#fff}.header-sub{font-size:12px;color:#fff;opacity:.9}

.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{color:var(--orange-dark);margin-bottom:15px;font-size:20px}

.btn-orange{background:var(--orange);color:#fff}.btn-light{background:var(--orange-light);color:var(--orange-dark);border:1px solid #ffd4b5}.btn-danger{background:var(--red);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-blue{background:var(--blue);color:#fff}.btn-gray{background:#666;color:#fff}.full{width:100%;margin:0}
.login-box{max-width:430px;margin:55px auto}.login-logo{display:block;width:145px;height:65px;object-fit:contain;margin:0 auto 18px}.login-box h2{text-align:center;color:var(--orange-dark);margin-bottom:20px}

.price-box{background:#fff8f2;border:1px solid #ffd7bd;border-radius:12px;padding:13px;margin-top:8px}.price-preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.price-preview .sale{font-size:22px;font-weight:900;color:var(--orange-dark)}.price-preview .regular{font-size:13px;color:#999;text-decoration:line-through}.price-preview .off{background:#e53935;color:#fff;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:800}

.order-card{background:#fff;border:1px solid #ececec;border-radius:17px;margin-bottom:15px;box-shadow:0 5px 18px rgba(0,0,0,.055);overflow:hidden}.order-card-top{padding:15px 17px;background:linear-gradient(135deg,#fffaf5,#fff);border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:12px}.order-number{font-size:16px;font-weight:800}.order-date{font-size:11px;color:#888}.order-badges{display:flex;gap:6px;flex-wrap:wrap}.order-status-badge,.payment-status-badge{padding:6px 10px;border-radius:20px;font-size:11px;font-weight:800}.order-status-pending,.payment-status-pending{background:#fff3cd;color:#946c00}.order-status-confirmed{background:#e8f1ff;color:#1558a6}.order-status-processing{background:#eee8ff;color:#6236a5}.order-status-shipped{background:#e4f7ff;color:#087493}.order-status-delivered,.payment-status-paid{background:#e8fff0;color:#138a3c}.order-status-cancelled,.payment-status-failed{background:#ffe9e9;color:#c62828}.payment-status-refunded{background:#eee;color:#555}.order-main{padding:16px 17px}.order-customer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.info-box{background:#fafafa;border:1px solid #eee;border-radius:11px;padding:11px 12px}.info-label{font-size:10px;text-transform:uppercase;color:#999;font-weight:800;letter-spacing:.4px}.info-value{font-size:13px;font-weight:700;color:#333;word-break:break-word}.items-box{background:#fffaf5;border:1px solid #ffe4d1;border-radius:12px;padding:11px;margin:13px 0}.items-title{font-size:13px;font-weight:800;color:var(--orange-dark)}.item-row{display:flex;justify-content:space-between;gap:10px;padding:10px 3px;border-bottom:1px solid #f0e4dc}.item-row:last-child{border-bottom:0}.item-name{font-weight:700;font-size:13px}.item-details{font-size:11px;color:#777}.item-total{font-weight:800;font-size:13px;white-space:nowrap}.order-summary{border-top:1px dashed #ddd;padding-top:12px;margin-top:10px}.summary-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:#555}.summary-total{display:flex;justify-content:space-between;padding-top:9px;margin-top:5px;border-top:1px solid #eee;font-size:17px;font-weight:900;color:var(--orange-dark)}.order-bottom{padding:13px 17px;background:#fafafa;border-top:1px solid #eee}.order-control-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control-label{font-size:10px;font-weight:800;color:#888;display:block;margin-bottom:5px;text-transform:uppercase}.order-select{height:42px;font-weight:700}.order-quick-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.quick-status,.view-order-btn{border:0;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:800}.quick-status{background:#fff;border:1px solid #ddd}.view-order-btn{background:#171717;color:#fff}
.order-modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:15px;z-index:5000}.order-modal.show{display:flex}.order-modal-box{width:100%;max-width:760px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px}.order-modal-header{position:sticky;top:0;z-index:2;background:var(--gradient);color:#fff;padding:17px 18px;display:flex;justify-content:space-between}.order-modal-title{font-size:18px;font-weight:900}.order-modal-close{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px}.order-modal-body{padding:18px}.modal-section{border:1px solid #eee;border-radius:13px;padding:13px;margin-bottom:13px}.modal-section-title{font-size:14px;font-weight:900;color:var(--orange-dark);margin-bottom:10px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal-info{background:#fafafa;padding:10px;border-radius:9px}.modal-info small{display:block;color:#999;font-size:10px;font-weight:800;text-transform:uppercase}.modal-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.modal-total{font-size:20px;font-weight:900;color:var(--orange-dark);display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed #ddd}
.banner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.banner-image{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:10px;background:#f5f5f5}.banner-card,.reseller-card,.review-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,.04)}.banner-head,.reseller-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.banner-active{background:#e9fff0;color:#138a3c;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:bold}.banner-inactive{background:#f3f3f3;color:#777;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.toast{position:fixed;right:18px;bottom:18px;background:#171717;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:9999;font-size:13px;font-weight:700;opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateY(0)}.toast.success{background:#138a3c}.toast.error{background:#c62828}
footer{text-align:center;padding:30px 15px;color:#777;font-size:13px}
@media(max-width:1050px){.admin-nav{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr)}.product-grid{grid-template-columns:repeat(2,1fr)}.banner-grid{grid-template-columns:1fr}.orders-toolbar-top{flex-direction:column;align-items:stretch}.order-search{max-width:none}}
@media(max-width:600px){header{padding:8px 10px}.header-logo{width:88px;height:40px}.header-title{font-size:15px}.header-sub{font-size:9px}.admin-nav{grid-template-columns:repeat(2,1fr)}.product-grid{grid-template-columns:1fr}.order-card-top{align-items:flex-start;flex-direction:column}.order-customer,.order-control-grid,.modal-grid{grid-template-columns:1fr}.admin-actions{flex-direction:column}.admin-actions .btn,.admin-actions select{width:100%}.order-modal{padding:8px}.order-modal-box{max-height:95vh;border-radius:16px}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="header-brand"><img src="logo.png" class="header-logo" alt="Gadhuli"><div><div class="header-title">👨‍💼 Gadhuli Admin</div><div class="header-sub">Premium Marketplace Management</div></div></div><button type="button" class="btn btn-light" id="websiteButton">🏠 Website</button></div></header>

<div id="loginSection" class="container"><div class="card login-box"><img src="logo.png" class="login-logo" alt="Gadhuli"><h2>🔐 Admin Login</h2><div class="form-group"><label>Email</label><input id="loginEmail" type="email" placeholder="Admin Email" autocomplete="email"></div><div class="form-group"><label>Password</label><div class="password-wrap"><input id="loginPassword" type="password" placeholder="Admin Password" autocomplete="current-password"><button type="button" class="password-eye" id="passwordEye">👁️</button></div></div><button type="button" id="loginButton" class="btn btn-orange full">🔐 Login</button><div id="loginMessage" style="margin-top:12px;text-align:center"></div></div></div>

<div id="adminPanel" class="container hidden">
<div class="stat-grid"><div class="stat"><div class="stat-icon">🛍️</div><div class="stat-label">Products</div><div class="stat-number" id="statProducts">0</div></div><div class="stat"><div class="stat-icon">📦</div><div class="stat-label">Orders</div><div class="stat-number" id="statOrders">0</div></div><div class="stat"><div class="stat-icon">⏳</div><div class="stat-label">Pending Orders</div><div class="stat-number" id="statPending">0</div></div><div class="stat"><div class="stat-icon">🤝</div><div class="stat-label">Reseller Requests</div><div class="stat-number" id="statResellers">0</div></div></div>
<div class="card"><div class="admin-nav"><button type="button" class="btn btn-light active" data-section="orders">📦 Orders</button><button type="button" class="btn btn-light" data-section="products">🛍️ Products</button><button type="button" class="btn btn-light" data-section="addProduct">➕ Add Product</button><button type="button" class="btn btn-light" data-section="banners">🖼️ Banners</button><button type="button" class="btn btn-light" data-section="resellers">🤝 Resellers</button><button type="button" class="btn btn-light" data-section="reviews">⭐ Reviews</button><button type="button" class="btn btn-light" id="refreshButton">🔄 Refresh</button></div></div>
<div id="sectionContent"><div class="loading"><span class="spinner"></span>Loading...</div></div>
<button type="button" class="btn btn-danger full" id="logoutButton">🚪 Admin Logout</button>
</div>
<footer><b>Gadhuli Admin Panel</b><br><br>© 2026 Gadhuli. All Rights Reserved.</footer>
<div id="toast" class="toast"></div>
<div id="orderModal" class="order-modal"><div class="order-modal-box"><div class="order-modal-header"><div class="order-modal-title" id="orderModalTitle">📦 Order Details</div><button type="button" class="order-modal-close" id="closeOrderModal">×</button></div><div id="orderModalBody" class="order-modal-body"></div></div></div>

<script>
const SUPABASE_URL="https://ypmmdytgfuhydzacjbkw.supabase.co";
const SUPABASE_KEY="sb_publishable_ZhmwEV_6UngmzzxcJmETgw_smrA7qDL";
const ADMIN_EMAIL="hridoyff974@gmail.com";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentSection="orders",orderSearchText="",orderStatusFilter="All",paymentStatusFilter="All",cachedOrders=[];

const categories={
"Men's Fashion":["T-Shirt","Polo T-Shirt","Shirt","Panjabi","Jeans","Pants","Shorts","Hoodie & Sweatshirt","Jacket"],
"Women's Fashion":["Saree","Three Piece","Kurti","Tops","Gown","Hijab","Abaya","Women's Pants"],
"Kids & Baby":["Boys Clothing","Girls Clothing","Baby Clothing","Baby Accessories","Toys"],
"Shoes":["Men's Shoes","Women's Shoes","Kids Shoes","Sneakers","Sandals","Slippers"],
"Bags & Accessories":["Backpacks","Handbags","Wallets","Belts","Caps","Sunglasses","Fashion Accessories"],
"Watches":["Men's Watches","Women's Watches","Smart Watches","Kids Watches"],
"Electronics":["Mobile Accessories","Earphones & Headphones","Speakers","Chargers","Power Banks","Smart Gadgets"],
"Beauty & Personal Care":["Skincare","Hair Care","Makeup","Perfume","Personal Care"],
"Home & Living":["Home Decor","Bedding","Storage","Lighting","Kitchen & Dining"]};
const sizeData={"T-Shirt":["S","M","L","XL","2XL","4XL"],"Polo T-Shirt":["S","M","L","XL","2XL","4XL"],"Shirt":["S","M","L","XL","2XL","4XL"],"Hoodie & Sweatshirt":["S","M","L","XL","2XL","4XL"],"Jacket":["S","M","L","XL","2XL","4XL"],"Panjabi":["28","30","32","34","36","38","40","42","44","46","48"],"Pants":["28","30","32","34","36","38","40"],"Jeans":["28","30","32","34","36","38","40"],"Shorts":["28","30","32","34","36","38","40"],"Three Piece":["S","M","L","XL","2XL"],"Kurti":["S","M","L","XL","2XL"],"Tops":["S","M","L","XL","2XL"],"Gown":["S","M","L","XL","2XL"],"Abaya":["S","M","L","XL","2XL"],"Women's Pants":["28","30","32","34","36","38"],"Saree":["Free Size"],"Hijab":["Free Size"]};

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function money(v){return Number(v||0).toLocaleString("en-US",{maximumFractionDigits:2})}
function showToast(m,t="success"){const x=document.getElementById("toast");x.textContent=m;x.className="toast show "+(t==="error"?"error":"success");clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>x.className="toast",2500)}
function formatDate(v){if(!v)return"—";try{return new Date(v).toLocaleString("en-BD",{dateStyle:"medium",timeStyle:"short"})}catch(e){return String(v)}}
function showError(m){document.getElementById("sectionContent").innerHTML=`<div class="card"><div class="notice"><b style="color:#d32f2f">❌ Error</b><br><br>${esc(m)}</div></div>`}
function goHome(){location.href="index.html"}
function setActiveNav(s){document.querySelectorAll(".admin-nav [data-section]").forEach(b=>b.classList.remove("active"));const a=document.querySelector('.admin-nav [data-section="'+s+'"]');if(a)a.classList.add("active")}
function togglePassword(){const i=document.getElementById("loginPassword"),e=document.getElementById("passwordEye");i.type=i.type==="password"?"text":"password";e.textContent=i.type==="password"?"👁️":"🙈"}

async function isAdmin(){if(!currentUser)return{ok:false,message:"Supabase user পাওয়া যায়নি।"};const r=await db.from("profiles").select("id,role").eq("id",currentUser.id).maybeSingle();if(r.error)return{ok:false,message:r.error.message};if(!r.data)return{ok:false,message:"এই Auth User-এর profiles row নেই। User ID: "+currentUser.id};if(String(r.data.role||"").toLowerCase()!=="admin")return{ok:false,message:"এই profile-এর role = "+(r.data.role||"NULL")+". Admin role হতে হবে: admin"};return{ok:true,data:r.data}}

async function adminLogin(){const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value,msg=document.getElementById("loginMessage"),button=document.getElementById("loginButton");if(!email||!password){msg.innerHTML='<span style="color:#d32f2f">Email এবং Password দিন।</span>';return}button.disabled=true;button.textContent="⏳ Login হচ্ছে...";try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;currentUser=r.data.user;if(String(currentUser.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();currentUser=null;throw new Error("এই Email-এর Admin access নেই।")}const a=await isAdmin();if(!a.ok){await db.auth.signOut();currentUser=null;throw new Error(a.message)}showAdmin()}catch(e){msg.innerHTML='<span style="color:#d32f2f">'+esc(e.message||e)+'</span>'}finally{button.disabled=false;button.textContent="🔐 Login"}}
function showAdmin(){document.getElementById("loginSection").classList.add("hidden");document.getElementById("adminPanel").classList.remove("hidden");loadStats();showSection("orders")}
async function checkSession(){try{const r=await db.auth.getSession();currentUser=r.data.session?.user||null;if(!currentUser)return;if(String(currentUser.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();currentUser=null;return}const a=await isAdmin();if(a.ok)showAdmin()}catch(e){console.error(e)}}
async function adminLogout(){await db.auth.signOut();currentUser=null;document.getElementById("adminPanel").classList.add("hidden");document.getElementById("loginSection").classList.remove("hidden");document.getElementById("loginMessage").innerHTML=""}
async function showSection(s){currentSection=s;setActiveNav(s);document.getElementById("sectionContent").innerHTML='<div class="loading"><span class="spinner"></span>Loading...</div>';try{if(s==="orders")await renderOrders();else if(s==="products")await renderProducts();else if(s==="addProduct")renderAddProduct();else if(s==="banners")await renderBanners();else if(s==="resellers")await renderResellers();else if(s==="reviews")await renderReviews()}catch(e){console.error(e);showError(e.message||e)}}
async function refreshAdmin(){const b=document.getElementById("refreshButton");b.disabled=true;b.textContent="⏳ Refresh...";try{await loadStats();await showSection(currentSection);showToast("Admin data refreshed ✅")}finally{b.disabled=false;b.textContent="🔄 Refresh"}}

async function renderOrders(){const box=document.getElementById("sectionContent"),r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error)return showError(r.error.message);cachedOrders=[];for(const o of r.data||[]){const q=await db.from("order_items").select("*").eq("order_id",o.id);cachedOrders.push({...o,_items:q.data||[]})}let f=cachedOrders.filter(o=>{const s=String(o.order_status||"Pending"),p=String(o.payment_status||"Pending"),q=orderSearchText.toLowerCase().trim(),search=[o.id,o.customer_name,o.customer_phone,o.customer_district,o.district,o.customer_thana,o.thana,o.address,o.customer_receive_place].map(x=>String(x||"").toLowerCase()).join(" ");return(!q||search.includes(q))&&(orderStatusFilter==="All"||s.toLowerCase()===orderStatusFilter.toLowerCase())&&(paymentStatusFilter==="All"||p.toLowerCase()===paymentStatusFilter.toLowerCase())});let h=renderOrderToolbar()+`<div style="font-size:12px;color:#777;margin:0 2px 10px">Showing <b>${f.length}</b> of <b>${cachedOrders.length}</b> orders</div>`;if(!f.length){box.innerHTML=h+`<div class="empty">🔎<br><br><b>এই filter/search অনুযায়ী কোনো Order পাওয়া যায়নি।</b><br><br><button class="btn btn-light" id="clearOrderFilters">↻ Clear Filters</button></div>`;bindOrderToolbar();return}h+=f.map(o=>{const items=o._items||[],sub=items.reduce((a,i)=>a+Number(i.price||0)*Number(i.quantity||1),0),delivery=Number(o.delivery_charge||0),total=Number(o.total??o.total_amount??sub+delivery),status=o.order_status||"Pending",payment=o.payment_status||"Pending",address=o.customer_receive_place||o.address||"—",district=o.customer_district||o.district||"—",thana=o.customer_thana||o.thana||"—";return`<div class="order-card"><div class="order-card-top"><div><div class="order-number">📦 Order #${esc(o.id)}</div><div class="order-date">${formatDate(o.created_at)}</div></div><div class="order-badges"><span class="order-status-badge ${orderStatusClass(status)}">${esc(status)}</span><span class="payment-status-badg l><select class="order-select payment-status-select" data-order-id="${esc(o.id)}">${["Pending","Paid","Failed","Refunded"].map(s=>`<option ${s.toLowerCase()===String(payment).toLowerCase()?"selected":""}>${s}</option>`).join("")}</select></div></div><div class="order-quick-actions">${["Confirmed","Processing","Shipped","Delivered"].map(s=>`<button class="quick-status" data-quick-status="${s}" data-order-id="${esc(o.id)}">${s==="Confirmed"?"✅":s==="Processing"?"⚙️":s==="Shipped"?"🚚":"🎉"} ${s}</button>`).join("")}</div></div></div>`}).join("");box.innerHTML=h;bindOrderToolbar();bindOrderControls()}

function bindOrderToolbar(){const s=document.getElementById("orderSearch");if(s)s.addEventListener("input",()=>{orderSearchText=s.value;renderOrders()});document.querySelectorAll("[data-order-filter]").forEach(b=>b.onclick=()=>{orderStatusFilter=b.dataset.orderFilter;renderOrders()});document.querySelectorAll("[data-payment-filter]").forEach(b=>b.onclick=()=>{paymentStatusFilter=b.dataset.paymentFilter;renderOrders()});const c=document.getElementById("clearOrderFilters");if(c)c.onclick=()=>{orderSearchText="";orderStatusFilter="All";paymentStatusFilter="All";renderOrders()};document.querySelectorAll(".view-order").forEach(b=>b.onclick=()=>openOrderModal(b.dataset.orderId))}

async function renderProducts(){const box=document.getElementById("sectionContent"),r=await db.from("products").select("*").order("id",{ascending:false});if(r.error)return showError(r.error.message);if(!r.data?.length){box.innerHTML=`<div class="empty">🛍️ কোনো Product নেই।</div>`;return}box.innerHTML=`<div class="notice">🛍️ Product list — discount price সহ।</div><div class="product-grid">${r.data.map(p=>{let im=Array.isArray(p.images)?p.images[0]||"":typeof p.images==="string"?p.images:"";const price=Number(p.price||0),sale=Number(p.discount_price||0),off=price>0&&sale>0&&sale<price?Math.round((price-sale)/price*100):0;return`<div class="product-card"><img class="product-image" src="${esc(im||"https://via.placeholder.com/500x500?text=Gadhuli")}"><div class="product-name">${esc(p.name)}</div><div class="product-price">৳${money(sale||price)} ${off?`<span class="old-price">৳${money(price)}</span><span class="discount-badge">-${off}% OFF</span>`:""}</div><div class="product-meta">${esc(p.category||"")}${p.subcategory?" • "+esc(p.subcategory):""}</div><div class="admin-actions"><button class="btn btn-light edit-product" data-id="${esc(p.id)}">✏️ Edit</button><button class="btn btn-danger delete-product" data-id="${esc(p.id)}">🗑️ Delete</button></div></div>`}).join("")}</div>`;box.querySelectorAll(".edit-product").forEach(b=>b.onclick=()=>editProduct(b.dataset.id));box.querySelectorAll(".delete-product").forEach(b=>b.onclick=()=>deleteProduct(b.dataset.id))}

function renderAddProduct(){const box=document.getElementById("sectionContent");box.innerHTML=`<div class="card"><h2>➕ Add New Product</h2><div class="form-group"><label>Product Name *</label><input id="productName" placeholder="Product name"></div><div class="form-group"><label>Regular Price * (৳)</label><input id="productPrice" type="number" min="0" step="0.01" placeholder="1200"></div><div class="form-group"><label>Discount Percentage (%)</label><input id="productDiscount" type="number" min="0" max="99" step="1" value="0" placeholder="25"><small style="color:#777;display:block;margin-top:5px">0% = No discount. Maximum 99%.</small><div class="price-box"><div style="font-weight:800;margin-bottom:8px">💰 Selling Price Preview</div><div id="pricePreview" class="price-preview"><span class="sale">৳0</span></div></div></div><div class="form-group"><label>Category *</label><select id="productCategory"><option value="">Select Category</option>${Object.keys(categories).map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div class="form-group"><label>Subcategory</label><select id="productSubcategory"><option value="">Select Subcategory</option></select></div><div class="form-group"><label>Available Sizes</label><div id="sizeOptions" class="size-list">Subcategory select করুন।</div></div><div class="form-group"><label>Description</label><textarea id="productDescription" rows="5" placeholder="Product description"></textarea></div><div class="form-group"><label>Product Images *</label><input id="productImages" type="file" accept="image/*" multiple><small>১ থেকে ৫টি ছবি select করুন।</small><div id="imagePreview" class="image-preview"></div></div><button type="button" id="saveProductButton" class="btn btn-orange full">💾 Save Product</button></div>`;document.getElementById("productCategory").onchange=updateSubcategories;document.getElementById("productSubcategory").onchange=updateSizes;document.getElementById("productImages").onchange=previewImages;document.getElementById("productPrice").oninput=updatePricePreview;document.getElementById("productDiscount").oninput=updatePricePreview;updatePricePreview();document.getElementById("saveProductButton").onclick=saveProduct}
function updatePricePreview(){const p=Number(document.getElementById("productPrice")?.value||0),d=Math.min(99,Math.max(0,Number(document.getElementById("productDiscount")?.value||0)));const sale=p*(1-d/100),box=document.getElementById("pricePreview");if(!box)return;box.innerHTML=d>0&&p>0?`<span class="sale">৳${money(sale)}</span><span class="regular">৳${money(p)}</span><span class="off">-${d}% OFF</span>`:`<span class="sale">৳${money(p)}</span>`}
function updateSubcategories(){const c=document.getElementById("productCategory").value,s=document.getElementById("productSubcategory");s.innerHTML='<option value="">Select Subcategory</option>';(categories[c]||[]).forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;s.appendChild(o)});updateSizes()}
function updateSizes(){const sub=document.getElementById("productSubcategory").value,b=document.getElementById("sizeOptions"),sizes=sizeData[sub]||[];b.innerHTML=sizes.length?sizes.map(s=>`<label class="size-label"><input type="checkbox" class="size-check" value="${esc(s)}">${esc(s)}</label>`).join(""):"এই Product-এর জন্য Size নেই।"}
function previewImages(){const i=document.getElementById("productImages"),b=document.getElementById("imagePreview");b.innerHTML="";const fs=Array.from(i.files||[]);if(fs.length>5){alert("Maximum 5টি ছবি select করা যাবে।");i.value="";return}fs.forEach(f=>{const im=document.createElement("img");im.src=URL.createObjectURL(f);im.style.width="85px";im.style.height="85px";im.style.objectFit="cover";im.style.borderRadius="9px";b.appendChild(im)})}
async function saveProduct(){const name=document.getElementById("productName").value.trim(),price=Number(document.getElementById("productPrice").value),discount=Math.min(99,Math.max(0,Number(document.getElementById("productDiscount").value||0))),category=document.getElementById("productCategory").value,subcategory=document.getElementById("productSubcategory").value,description=document.getElementById("productDescription").value.trim(),input=document.getElementById("productImages"),files=Array.from(input.files||[]);if(!name||price<=0||!category||!files.length)return alert("Product Name, Price, Category এবং Image দিন।");if(files.length>5)return alert("Maximum 5টি ছবি দেওয়া যাবে।");const sizes=Array.from(document.querySelectorAll(".size-check:checked")).map(x=>x.value),discountPrice=discount>0?Number((price*(1-discount/100)).toFixed(2)):null,b=document.getElementById("saveProductButton");try{b.disabled=true;b.textContent="⏳ Uploading...";const urls=[];for(const f of files){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path="products/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+safe,u=await db.storage.from("product-images").upload(path,f,{upsert:false});if(u.error)throw u.error;urls.push(db.storage.from("product-images").getPublicUrl(path).data.publicUrl)}const r=await db.from("products").insert({name,price,discount_price:discountPrice,category,subcategory,sizes,description,images:urls});if(r.error)throw r.error;alert("Product Save হয়েছে ✅");await loadStats();await showSection("products")}catch(e){alert("Product Save হয়নি ❌\n\n"+(e.message||e))}finally{b.disabled=false;b.textContent="💾 Save Product"}}

async function renderBanners(){
  const box=document.getElementById("sectionContent");
  const r=await db.from("advertisements").select("*").order("sort_order",{ascending:true});

  }).join("");

async function approveReseller(uid,id){let r=await db.from("resellers").update({status:"Approved"}).eq("id",id);if(r.error)return alert(r.error.message);r=await db.from("profiles").update({role:"reseller"}).eq("id",uid);if(r.error)return alert(r.error.message);alert("Reseller Approved হয়েছে ✅");await loadStats();await renderResellers()}
async function suspendReseller(uid,id){if(!confirm("এই Reseller Suspend করবেন?"))return;let r=await db.from("resellers").update({status:"Suspended"}).eq("id",id);if(r.error)return alert(r.error.message);r=await db.from("profiles").update({role:"customer"}).eq("id",uid);if(r.error)return alert(r.error.message);alert("Reseller Suspended হয়েছে 🚫");await loadStats();await renderResellers()}
async function renderReviews(){const box=document.getElementById("sectionContent"),r=await db.from("reviews").select("*").order("created_at",{ascending:false});if(r.error)return showError(r.error.message);if(!r.data?.length){box.innerHTML='<div class="empty">⭐ কোনো Review নেই।</div>';return}box.innerHTML=r.data.map(x=>`<div class="review-card"><b>${esc(x.user_name||"Customer")}</b><br><span>${"⭐".repeat(Math.min(5,Number(x.rating||0)))}</span><p style="margin-top:7px">${esc(x.review_text||"")}</p><p>Status: <b>${esc(x.status||"Pending")}</b></p><div class="admin-actions"><button class="btn btn-orange review-approve" data-id="${x.id}">✅ Approve</button><button class="btn btn-danger review-reject" data-id="${x.id}">❌ Reject</button></div></div>`).join("");document.querySelectorAll(".review-approve").forEach(b=>b.onclick=()=>updateReview(b.dataset.id,"Approved"));document.querySelectorAll(".review-reject").forEach(b=>b.onclick=()=>updateReview(b.dataset.id,"Rejected"))}
async function updateReview(id,status){const r=await db.from("reviews").update({status}).eq("id",id);if(r.error)return alert(r.error.message);await renderReviews()}

function setupEvents(){document.querySelectorAll(".admin-nav [data-section]").forEach(b=>b.onclick=()=>showSection(b.dataset.section));document.getElementById("refreshButton").onclick=refreshAdmin;document.getElementById("websiteButton").onclick=goHome;document.getElementById("loginButton").onclick=adminLogin;document.getElementById("passwordEye").onclick=togglePassword;document.getElementById("logoutButton").onclick=adminLogout;document.getElementById("closeOrderModal").onclick=closeOrderModal;document.getElementById("orderModal").onclick=e=>{if(e.target.id==="orderModal")closeOrderModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOrderModal()});document.getElementById("loginPassword").onkeydown=e=>{if(e.key==="Enter")adminLogin()};document.getElementById("loginEmail").onkeydown=e=>{if(e.key==="Enter")adminLogin()}}
document.addEventListener("DOMContentLoaded",()=>{setupEvents();checkSession()});
</script>
