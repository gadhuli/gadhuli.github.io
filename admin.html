<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gadhuli | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#333;
}

header{
  background:linear-gradient(135deg,#8f174d,#d52b72);
  color:white;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:8px;
  background:white;
}

.logo h1{
  font-size:22px;
}

.back{
  color:white;
  text-decoration:none;
  font-weight:bold;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.5);
  border-radius:8px;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(143,23,77,.08);
}

.card h2{
  color:#8f174d;
  margin-bottom:18px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#8f174d;
}

button{
  border:none;
  border-radius:8px;
  padding:11px 16px;
  background:#8f174d;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#6f103b;
}

.btn-danger{
  background:#c62828;
}

.btn-danger:hover{
  background:#9e1f1f;
}

.btn-secondary{
  background:#777;
}

.btn-secondary:hover{
  background:#555;
}

.hidden{
  display:none !important;
}

.message{
  padding:10px;
  border-radius:8px;
  margin-bottom:12px;
  display:none;
}

.success{
  background:#e8f5e9;
  color:#2e7d32;
}

.error{
  background:#ffebee;
  color:#c62828;
}

.preview{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:10px 0 15px;
}

.preview img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid #eee;
}

.product{
  border:1px solid #eee;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
}

.product-info{
  flex:1;
}

.product-info h3{
  color:#8f174d;
  margin-bottom:5px;
}

.product-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

#loginSection{
  max-width:450px;
  margin:60px auto;
}

label{
  font-weight:bold;
  color:#555;
  display:block;
  margin-top:5px;
}

.small{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.logout{
  margin-top:15px;
}

@media(max-width:600px){

  header{
    padding:12px;
  }

  .logo h1{
    font-size:19px;
  }

  .logo img{
    width:36px;
    height:36px;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:75px;
    height:75px;
  }

  .product-actions{
    margin-top:8px;
  }

  button{
    font-size:14px;
    padding:10px 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="Gadhuli">
    <h1>Gadhuli Admin</h1>
  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Website
  </a>
</header>

<div class="container">

  <!-- LOGIN -->
  <section id="loginSection" class="card">

    <h2>🔐 Admin Login</h2>

    <div id="loginMessage" class="message"></div>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

  </section>


  <!-- ADMIN PANEL -->
  <section
    id="adminPanel"
    class="hidden"
  >

    <!-- ADD PRODUCT -->
    <div class="card">

      <h2>➕ Add New Product</h2>

      <div id="productMessage" class="message"></div>

      <form id="productForm">

        <label>Product Name</label>
        <input
          type="text"
          id="productName"
          placeholder="Product Name"
          required
        >

        <label>Price (৳)</label>
        <input
          type="number"
          id="productPrice"
          placeholder="Product Price"
          min="0"
          required
        >

        <label>Category</label>
        <select id="productCategory" required>
          <option value="">Select Category</option>
          <option value="Fashion">Fashion</option>
          <option value="Electronics">Electronics</option>
          <option value="Beauty">Beauty</option>
          <option value="Home">Home</option>
          <option value="Accessories">Accessories</option>
          <option value="Other">Other</option>
        </select>

        <label>📝 Description</label>
        <textarea
          id="productDescription"
          rows="4"
          placeholder="Product description"
        ></textarea>

        <label>🖼️ Product Images (1–5)</label>

        <input
          type="file"
          id="images"
          accept="image/*"
          multiple
          required
        >

        <div
          id="preview"
          class="preview"
        ></div>

        <button type="submit">
          💾 Save Product
        </button>

      </form>

    </div>


    <!-- MANAGE PRODUCTS -->
    <div class="card">

      <h2>📦 Manage Products</h2>

      <div id="productsList">
        Loading products...
      </div>

      <button
        type="button"
        id="logoutBtn"
        class="btn-secondary logout"
      >
        🚪 Logout
      </button>

    </div>

  </section>

</div>


<script>

const db = window.gadhuliSupabase;

const ADMIN_EMAIL = "hridoyff974@gmail.com";


// ===============================
// MESSAGE
// ===============================

function showMessage(id,text,type){

  const box = document.getElementById(id);

  box.textContent = text;

  box.className = "message " + type;

  box.style.display = "block";

}


// ===============================
// LOGIN
// ===============================

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  try{

    const { data, error } =
      await db.auth.signInWithPassword({
        email:email,
        password:password
      });

    if(error){
      throw error;
    }

    if(!data.user){
      throw new Error("Login failed");
    }

    if(data.user.email !== ADMIN_EMAIL){

      await db.auth.signOut();

      throw new Error("এই account Admin নয়।");

    }

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");

    loadProducts();

  }catch(error){

    showMessage(
      "loginMessage",
      error.message || "Login failed",
      "error"
    );

  }

});


// ===============================
// IMAGE PREVIEW
// ===============================

document
.getElementById("images")
.addEventListener("change",function(){

  const preview =
    document.getElementById("preview");

  preview.innerHTML = "";

  const files = Array.from(this.files);

  if(files.length > 5){

    alert("Maximum 5 images allowed.");

    this.value = "";

    return;
  }

  files.forEach(file => {

    const reader = new FileReader();

    reader.onload = function(e){

      const img =
        document.createElement("img");

      img.src = e.target.result;

      preview.appendChild(img);

    };

    reader.readAsDataURL(file);

  });

});


// ===============================
// ADD PRODUCT
// ===============================

document
.getElementById("productForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const name =
    document.getElementById("productName")
    .value.trim();

  const price =
    Number(
      document.getElementById("productPrice")
      .value
    );

  const category =
    document.getElementById("productCategory")
    .value;

  const description =
    document.getElementById("productDescription")
    .value.trim();

  const files =
    Array.from(
      document.getElementById("images").files
    );


  if(files.length < 1 || files.length > 5){

    showMessage(
      "productMessage",
      "Please select 1–5 images.",
      "error"
    );

    return;
  }


  try{

    showMessage(
      "productMessage",
      "Product save হচ্ছে...",
      "success"
    );


    const imageUrls = [];


    // ===============================
    // UPLOAD IMAGES
    // ===============================

    for(let i = 0; i < files.length; i++){

      const file = files[i];

      const extension =
        file.name.split(".").pop();

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;


      const filePath =
        "products/" + fileName;


      const { error:uploadError } =
        await db.storage
          .from("product-images")
          .upload(
            filePath,
            file,
            {
              cacheControl:"3600",
              upsert:false
            }
          );


      if(uploadError){
        throw uploadError;
      }


      const { data:urlData } =
        db.storage
          .from("product-images")
          .getPublicUrl(filePath);


      imageUrls.push(
        urlData.publicUrl
      );

    }


    // ===============================
    // SAVE DATABASE
    // ===============================

    const { error:insertError } =
      await db
        .from("products")
        .insert([
          {
            name:name,
            price:price,
            category:category,
            description:description,
            images:imageUrls
          }
        ]);


    if(insertError){
      throw insertError;
    }


    showMessage(
      "productMessage",
      "✅ Product successfully saved!",
      "success"
    );


    document
      .getElementById("productForm")
      .reset();

    document
      .getElementById("preview")
      .innerHTML = "";


    loadProducts();


  }catch(error){

    console.error(error);

    showMessage(
      "productMessage",
      "❌ Product Save হয়নি: " +
      (error.message || "Unknown error"),
      "error"
    );

  }

});


// ===============================
// LOAD PRODUCTS
// ===============================

async function loadProducts(){

  const list =
    document.getElementById("productsList");

  list.innerHTML =
    "Loading products...";


  try{

    const { data, error } =
      await db
        .from("products")
        .select("*")
        .order("id",{ascending:false});


    if(error){
      throw error;
    }


    if(!data || data.length === 0){

      list.innerHTML =
        "<p>No products found.</p>";

      return;
    }


    list.innerHTML = "";


    data.forEach(product => {

      const item =
        document.createElement("div");

      item.className = "product";


      let imageUrl =
        "https://via.placeholder.com/90";

      if(
        Array.isArray(product.images) &&
        product.images.length > 0
      ){

        imageUrl =
          product.images[0];

      }


      item.innerHTML = `

        <img
          src="${imageUrl}"
          alt="${escapeHtml(product.name || "Product")}"
        >

        <div class="product-info">

          <h3>
            ${escapeHtml(product.name || "")}
          </h3>

          <p>
            ৳${Number(product.price || 0)}
          </p>

          <p class="small">
            ${escapeHtml(product.category || "")}
          </p>

        </div>

        <div class="product-actions">

          <button
            type="button"
            class="btn-secondary"
            onclick="editProduct('${product.id}')"
          >
            ✏️ Edit
          </button>

          <button
            type="button"
            class="btn-danger"
            onclick="deleteProduct('${product.id}')"
          >
            🗑️ Delete
          </button>

        </div>

      `;


      list.appendChild(item);

    });


  }catch(error){

    console.error(error);

    list.innerHTML =
      "<p style='color:#c62828'>Products load হয়নি: " +
      escapeHtml(error.message || "") +
      "</p>";

  }

}


// ===============================
// EDIT PRODUCT
// ===============================

window.editProduct = async function(id){

  alert(
    "ছবি Edit করা যাবে না। নতুন Product যোগ করুন।"
  );

  return;

};


// ===============================
// DELETE PRODUCT
// ===============================

window.deleteProduct = async function(id){

  const confirmDelete =
    confirm(
      "এই Product টি Delete করতে চান?"
    );

  if(!confirmDelete){
    return;
  }


  try{

    const { error } =
      await db
        .from("products")
        .delete()
        .eq("id",id);


    if(error){
      throw error;
    }


    alert("Product deleted successfully.");

    loadProducts();


  }catch(error){

    alert(
      "Delete হয়নি: " +
      (error.message || "Unknown error")
    );

  }

};


// ===============================
// LOGOUT
// ===============================

document
.getElementById("logoutBtn")
.addEventListener("click", async function(){

  await db.auth.signOut();

  document
    .getElementById("adminPanel")
    .classList.add("hidden");

  document
    .getElementById("loginSection")
    .classList.remove("hidden");

});


// ===============================
// ESCAPE HTML
// ===============================

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ===============================
// CHECK EXISTING SESSION
// ===============================

(async function(){

  try{

    const { data } =
      await db.auth.getSession();


    if(
      data &&
      data.session &&
      data.session.user &&
      data.session.user.email === ADMIN_EMAIL
    ){

      document
        .getElementById("loginSection")
        .classList.add("hidden");

      document
        .getElementById("adminPanel")
        .classList.remove("hidden");

      loadProducts();

    }

  }catch(error){

    console.error(error);

  }

})();

</script>

</body>
</html>
