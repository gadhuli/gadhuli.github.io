function esc(v){

return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function money(v){

return Number(v||0)
.toLocaleString(
"en-US",
{
maximumFractionDigits:2
}
);

}


function formatDate(v){

try{

return new Date(v)
.toLocaleString(
"en-BD",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}catch(e){

return String(v||"—");

}

}

/* =========================
   LOGIN
   ========================= */

async function adminLogin(){

if(!db){

alert(
"Supabase connection পাওয়া যায়নি।"
);

return;

}


let email=
document.getElementById(
"loginEmail"
).value.trim();


let password=
document.getElementById(
"loginPassword"
).value;


if(!email||!password){

alert(
"Email এবং Password দিন।"
);

return;

}


let r=
await db.auth.signInWithPassword({

email,
password

});


if(r.error){

document.getElementById(
"loginMessage"
).innerHTML=
'<span style="color:#b00020">'+
esc(r.error.message)+
'</span>';

return;

}


currentUser=
r.data.user;


if(
currentUser.email.toLowerCase()!==
ADMIN_EMAIL.toLowerCase()
){

await db.auth.signOut();

alert(
"এই Email-এর Admin access নেই।"
);

return;

}


let admin=
await isAdmin();


if(!admin){

await db.auth.signOut();

alert(
"আপনার profile-এ Admin role নেই।"
);

return;

}


showAdmin();

}


/* =========================
   CHECK ADMIN
   ========================= */

async function isAdmin(){

if(!currentUser)
return false;


let r=
await db
.from("profiles")
.select("role")
.eq(
"id",
currentUser.id
)
.maybeSingle();


if(r.error)
return false;


return r.data?.role==="admin";

}

}

}

/* =========================
   ORDER STATUS
   ========================= */

async function updateOrderStatus(id,status){

if(!await isAdmin())
return alert("Admin access নেই।");


let old=
await db
.from("orders")
.select("*")
.eq("id",id)
.maybeSingle();


if(old.error||!old.data){

alert("Order পাওয়া যায়নি।");

return;

}


let r=
await db
.from("orders")
.update({
order_status:status
})
.eq("id",id);


if(r.error){

alert(
"Status update হয়নি ❌\n"+
r.error.message
);

return;

}


let verify=
await db
.from("orders")
.select(
"id,order_status"
)
.eq("id",id)
.maybeSingle();


if(
verify.error||
verify.data?.order_status!==status
){

alert(
"Database status update verify হয়নি ❌"
);

return;

}


if(
status==="Delivered"&&
old.data.order_status!=="Delivered"&&
old.data.reseller_id
){

await postCommission(old.data);

}


alert(
"Order status update হয়েছে ✅"
);


await loadStats();

await renderOrders();

}

/* =========================
   SAVE PRODUCT
   ========================= */

async function saveProduct(){

if(!await isAdmin())
return alert("Admin access নেই।");


let name=
document.getElementById(
"productName"
).value.trim();


let price=
Number(
document.getElementById(
"productPrice"
).value
);


let category=
document.getElementById(
"productCategory"
).value;


let subcategory=
document.getElementById(
"productSubcategory"
).value;


let description=
document.getElementById(
"productDescription"
).value.trim();


let files=
Array.from(
document.getElementById(
"productImages"
).files||[]
);


if(
!name||
!price||
!category||
!files.length
){

alert(
"Product Name, Price, Category এবং Image দিন।"
);

return;

}


if(files.length>5){

alert(
"Maximum 5টি ছবি দেওয়া যাবে।"
);

return;

}


let sizes=
Array.from(
document.querySelectorAll(
".size-check:checked"
)
)
.map(x=>x.value);


if(
subcategory&&
sizeData[subcategory]?.length&&
!sizes.length
){

alert(
"Product-এর Size select করুন।"
);

return;

}


let button=
event?.target;


try{

if(button){

button.disabled=true;

button.textContent=
"Uploading...";

}


let urls=[];


for(
const file of files
){

let safe=
file.name
.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


let path=
"products/"+
Date.now()+
"-"+
Math.random()
.toString(36)
.substring(2,8)+
"-"+
safe;


let upload=
await db
.storage
.from("product-images")
.upload(
path,
file,
{
upsert:false
}
);


if(upload.error)
throw upload.error;


let pub=
db
.storage
.from("product-images")
.getPublicUrl(path);


urls.push(
pub.data.publicUrl
);

}


let r=
await db
.from("products")
.insert({

name,
price,
category,
subcategory,
sizes,
description,
images:urls

});


if(r.error)
throw r.error;


alert(
"Product Save হয়েছে ✅"
);


showSection("products");

await loadStats();


}catch(e){

console.error(e);

alert(
"Product Save হয়নি ❌\n\n"+
(e?.message||String(e))
);

}finally{

if(button){

button.disabled=false;

button.textContent=
"💾 Save Product";

}

}

}

/* =========================
   RESELLER COMMISSION
   ========================= */

async function postCommission(order){

let r=
await db
.from("resellers")
.select("*")
.eq(
"user_id",
order.reseller_id
)
.maybeSingle();


if(
r.error||
!r.data||
r.data.status!=="Approved"
)

return;


let notes=
order.notes||"";


if(
notes.includes(
"[COMMISSION_POSTED]"
)
)

return;


let commission=
Number(order.subtotal||0)*
Number(r.data.commission_rate||0)/
100;


let u=
await db
.from("resellers")
.update({

total_orders:
Number(r.data.total_orders||0)+1,

total_sales:
Number(r.data.total_sales||0)+
Number(order.subtotal||0),

total_commission:
Number(r.data.total_commission||0)+
commission

})
.eq(
"user_id",
order.reseller_id
);


if(u.error){

console.error(
"Commission update failed",
u.error
);

return;

}


await db
.from("orders")
.update({

notes:
(notes?notes+"\n":"")+
"[COMMISSION_POSTED] Commission: ৳"+
commission.toFixed(2)

})
.eq(
"id",
order.id
);

}
