<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FF6B00">

<title>Gadhuli | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--orange:#FF6B00;
--orange-dark:#E65100;
--orange-light:#FFF3E8;
--orange-soft:#FFF8F2;
--gradient:linear-gradient(135deg,#FF8A00,#FF5A00);
--white:#fff;
--bg:#FFFDF9;
--text:#171717;
--muted:#777;
--border:#eee;
--red:#e53935;
--blue:#1677ff;
--green:#18a957;
--purple:#7c3aed;
--shadow:0 5px 20px rgba(255,107,0,.10);
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.5;
min-height:100vh;
}

button,
input,
select,
textarea{
font-family:inherit;
}

button{
cursor:pointer;
}

img{
max-width:100%;
}

.hidden{
display:none!important;
}

/* =========================
HEADER
========================= */

header{
background:var(--gradient);
padding:10px 15px;
box-shadow:0 3px 15px rgba(0,0,0,.15);
position:sticky;
top:0;
z-index:1000;
}

.header-inner{
max-width:1250px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.header-brand{
display:flex;
align-items:center;
gap:12px;
min-width:0;
}

.header-logo{
width:110px;
height:48px;
object-fit:contain;
background:#fff;
border-radius:8px;
padding:4px 7px;
display:block;
flex-shrink:0;
}

.header-title{
font-size:21px;
font-weight:800;
color:#fff;
}

.header-sub{
font-size:12px;
color:#fff;
opacity:.9;
}

/* =========================
GENERAL
========================= */

.container{
max-width:1250px;
margin:20px auto;
padding:0 15px;
}

.card{
background:#fff;
border:1px solid var(--border);
border-radius:16px;
padding:18px;
margin-bottom:18px;
box-shadow:var(--shadow);
}

.card h2{
color:var(--orange-dark);
margin-bottom:15px;
font-size:20px;
}

.btn{
border:0;
padding:10px 15px;
border-radius:9px;
font-weight:700;
margin:3px;
transition:.2s;
}

.btn:hover{
transform:translateY(-1px);
}

.btn:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

.btn-orange{
background:var(--orange);
color:#fff;
}

.btn-light{
background:var(--orange-light);
color:var(--orange-dark);
border:1px solid #ffd4b5;
}

.btn-danger{
background:var(--red);
color:#fff;
}

.btn-green{
background:var(--green);
color:#fff;
}

.btn-blue{
background:var(--blue);
color:#fff;
}

.btn-gray{
background:#666;
color:#fff;
}

.full{
width:100%;
margin:0;
}

/* =========================
LOGIN
========================= */

.login-box{
max-width:430px;
margin:55px auto;
}

.login-logo{
display:block;
width:145px;
height:65px;
object-fit:contain;
margin:0 auto 18px;
}

.login-box h2{
text-align:center;
color:var(--orange-dark);
margin-bottom:20px;
}

.form-group{
margin-bottom:14px;
}

.form-group label{
display:block;
font-weight:700;
margin-bottom:6px;
color:#444;
}

input,
select,
textarea{
width:100%;
padding:11px 12px;
border:1px solid #ddd;
border-radius:9px;
outline:none;
background:#fff;
font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--orange);
box-shadow:0 0 0 2px rgba(255,107,0,.08);
}

/* =========================
PASSWORD
========================= */

.password-wrap{
position:relative;
}

.password-wrap input{
padding-right:52px;
}

.password-eye{
position:absolute;
right:5px;
top:50%;
transform:translateY(-50%);
width:42px;
height:38px;
border:0;
background:transparent;
border-radius:8px;
font-size:20px;
margin:0;
padding:0;
}

.password-eye:hover{
background:var(--orange-light);
}

/* =========================
STATS
========================= */

.stat-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px;
margin-bottom:18px;
}

.stat{
background:#fff;
border:1px solid var(--border);
border-radius:15px;
padding:18px;
text-align:center;
box-shadow:var(--shadow);
transition:.2s;
}

.stat:hover{
transform:translateY(-2px);
}

.stat-icon{
font-size:26px;
}

.stat-label{
font-size:13px;
color:var(--muted);
}

.stat-number{
font-size:26px;
font-weight:800;
color:var(--orange-dark);
}

/* =========================
NAVIGATION
========================= */

.admin-nav{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.admin-nav .btn{
margin:0;
min-height:46px;
}

.admin-nav .btn.active{
background:var(--orange);
color:#fff;
border-color:var(--orange);
}

/* =========================
CONTENT
========================= */

.notice{
background:var(--orange-light);
border:1px solid #ffd3b2;
padding:12px;
border-radius:10px;
margin-bottom:15px;
}

.empty{
padding:45px 15px;
text-align:center;
color:#888;
}

.loading{
padding:40px;
text-align:center;
color:var(--orange-dark);
font-weight:bold;
}

.spinner{
display:inline-block;
width:20px;
height:20px;
border:3px solid #ffd7bf;
border-top-color:var(--orange);
border-radius:50%;
animation:spin .8s linear infinite;
vertical-align:middle;
margin-right:7px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

/* =========================
PRODUCTS
========================= */

.product-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.product-card{
background:#fff;
border:1px solid var(--border);
border-radius:14px;
padding:13px;
box-shadow:0 3px 12px rgba(0,0,0,.05);
transition:.2s;
}

.product-card:hover{
transform:translateY(-2px);
box-shadow:0 7px 20px rgba(255,107,0,.12);
}

.product-image{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:10px;
background:#f5f5f5;
}

.product-name{
font-weight:800;
margin-top:9px;
}

.product-price{
font-size:19px;
font-weight:800;
color:var(--orange-dark);
margin:4px 0;
}

.product-meta{
font-size:12px;
color:#777;
}

/* =========================
IMAGES
========================= */

.image-preview{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}

.image-preview img{
width:85px;
height:85px;
object-fit:cover;
border-radius:9px;
border:1px solid #ddd;
}

/* =========================
PREMIUM ORDERS
========================= */

.orders-toolbar{
background:#fff;
border:1px solid var(--border);
border-radius:16px;
padding:15px;
margin-bottom:15px;
box-shadow:var(--shadow);
}

.orders-toolbar-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:13px;
}

.orders-title{
font-size:21px;
font-weight:800;
color:var(--orange-dark);
}

.orders-count{
font-size:12px;
color:#777;
margin-top:2px;
}

.order-search{
position:relative;
flex:1;
max-width:430px;
}

.order-search input{
padding-left:40px;
height:43px;
}

.order-search-icon{
position:absolute;
left:13px;
top:50%;
transform:translateY(-50%);
font-size:17px;
color:#999;
}

.order-filters{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:3px;
}

.order-filter{
border:1px solid #ffd4b5;
background:#fffaf5;
color:#9b4b12;
border-radius:20px;
padding:8px 13px;
font-size:12px;
font-weight:700;
white-space:nowrap;
cursor:pointer;
transition:.2s;
}

.order-filter.active{
background:var(--orange);
color:#fff;
border-color:var(--orange);
}

.payment-filter{
margin-top:9px;
display:flex;
gap:8px;
}

.payment-filter button{
border:1px solid #ddd;
background:#fff;
border-radius:20px;
padding:7px 12px;
font-size:12px;
font-weight:700;
}

.payment-filter button.active{
background:#171717;
color:#fff;
border-color:#171717;
}

.order-card{
background:#fff;
border:1px solid #ececec;
border-radius:17px;
padding:0;
margin-bottom:15px;
box-shadow:0 5px 18px rgba(0,0,0,.055);
overflow:hidden;
transition:.2s;
}

.order-card:hover{
box-shadow:0 8px 25px rgba(255,107,0,.12);
transform:translateY(-1px);
}

.order-card-top{
padding:15px 17px;
background:linear-gradient(
135deg,
#fffaf5,
#fff
);
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.order-number{
font-size:16px;
font-weight:800;
color:#222;
}

.order-date{
font-size:11px;
color:#888;
margin-top:2px;
}

.order-badges{
display:flex;
align-items:center;
gap:6px;
flex-wrap:wrap;
justify-content:flex-end;
}

.order-status-badge,
.payment-status-badge{
padding:6px 10px;
border-radius:20px;
font-size:11px;
font-weight:800;
white-space:nowrap;
}

.order-status-pending{
background:#fff3cd;
color:#946c00;
}

.order-status-confirmed{
background:#e8f1ff;
color:#1558a6;
}

.order-status-processing{
background:#eee8ff;
color:#6236a5;
}

.order-status-shipped{
background:#e4f7ff;
color:#087493;
}

.order-status-delivered{
background:#e8fff0;
color:#138a3c;
}

.order-status-cancelled{
background:#ffe9e9;
color:#c62828;
}

.payment-status-pending{
background:#fff3cd;
color:#946c00;
}

.payment-status-paid{
background:#e8fff0;
color:#138a3c;
}

.payment-status-failed{
background:#ffe9e9;
color:#c62828;
}

.payment-status-refunded{
background:#eee;
color:#555;
}

.order-main{
padding:16px 17px;
}

.order-customer{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:14px;
}

.info-box{
background:#fafafa;
border:1px solid #eee;
border-radius:11px;
padding:11px 12px;
}

.info-label{
font-size:10px;
text-transform:uppercase;
color:#999;
font-weight:800;
letter-spacing:.4px;
margin-bottom:3px;
}

.info-value{
font-size:13px;
font-weight:700;
color:#333;
word-break:break-word;
}

.items-box{
background:#fffaf5;
border:1px solid #ffe4d1;
border-radius:12px;
padding:11px;
margin:13px 0;
}

.items-title{
font-size:13px;
font-weight:800;
color:var(--orange-dark);
margin-bottom:6px;
}

.item-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:10px 3px;
border-bottom:1px solid #f0e4dc;
}

.item-row:last-child{
border-bottom:0;
}

.item-left{
min-width:0;
}

.item-name{
font-weight:700;
font-size:13px;
word-break:break-word;
}

.item-details{
font-size:11px;
color:#777;
margin-top:2px;
}

.item-total{
font-weight:800;
font-size:13px;
color:#333;
white-space:nowrap;
}

.order-summary{
border-top:1px dashed #ddd;
padding-top:12px;
margin-top:10px;
}

.summary-row{
display:flex;
justify-content:space-between;
gap:10px;
font-size:13px;
padding:4px 0;
color:#555;
}

.summary-total{
display:flex;
justify-content:space-between;
gap:10px;
padding-top:9px;
margin-top:5px;
border-top:1px solid #eee;
font-size:17px;
font-weight:900;
color:var(--orange-dark);
}

.order-bottom{
padding:13px 17px;
background:#fafafa;
border-top:1px solid #eee;
}

.order-control-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.control-label{
font-size:10px;
font-weight:800;
color:#888;
display:block;
margin-bottom:5px;
text-transform:uppercase;
}

.order-select{
width:100%;
height:42px;
font-weight:700;
background:#fff;
}

.order-save-note{
font-size:11px;
color:#888;
margin-top:8px;
}

.order-loading{
padding:18px;
text-align:center;
color:#777;
font-size:13px;
}

/* =========================
BANNERS
========================= */

.banner-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.banner-image{
width:100%;
aspect-ratio:16/7;
object-fit:cover;
border-radius:10px;
background:#f5f5f5;
}

.banner-active{
display:inline-block;
background:#e9fff0;
color:#138a3c;
padding:4px 9px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.banner-inactive{
display:inline-block;
background:#f3f3f3;
color:#777;
padding:4px 9px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.banner-card,
.reseller-card,
.review-card{
background:#fff;
border:1px solid var(--border);
border-radius:14px;
padding:15px;
margin-bottom:12px;
box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.banner-head,
.reseller-head{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
margin-bottom:12px;
}

/* =========================
SIZE
========================= */

.size-list{
display:flex;
flex-wrap:wrap;
gap:6px;
}

.size-label{
display:inline-flex;
align-items:center;
gap:5px;
background:#fffaf5;
border:1px solid #ffd0ad;
padding:7px 10px;
border-radius:8px;
cursor:pointer;
}

.size-label input{
width:auto;
}

/* =========================
ACTIONS
========================= */

.admin-actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px;
}

.admin-actions .btn{
margin:0;
}

.admin-actions select{
width:auto;
min-width:150px;
}

/* =========================
FOOTER
========================= */

footer{
text-align:center;
padding:30px 15px;
color:#777;
font-size:13px;
}

/* =========================
MOBILE
========================= */

@media(max-width:1050px){

.admin-nav{
grid-template-columns:repeat(4,1fr);
}

}

@media(max-width:800px){

.stat-grid{
grid-template-columns:repeat(2,1fr);
}

.product-grid{
grid-template-columns:repeat(2,1fr);
}

.banner-grid{
grid-template-columns:1fr;
}

.orders-toolbar-top{
flex-direction:column;
align-items:stretch;
}

.order-search{
max-width:none;
}

}

@media(max-width:600px){

header{
padding:8px 10px;
}

.header-inner{
gap:7px;
}

.header-brand{
gap:7px;
}

.header-logo{
width:88px;
height:40px;
padding:3px 5px;
}

.header-title{
font-size:15px;
}

.header-sub{
font-size:9px;
}

.header-inner > .btn{
padding:8px 9px;
font-size:12px;
}

.login-box{
margin:35px auto;
}

.login-logo{
width:125px;
height:55px;
}

.admin-nav{
grid-template-columns:repeat(2,1fr);
}

.admin-nav .btn{
font-size:13px;
padding:9px 5px;
}

.product-grid{
grid-template-columns:1fr;
}

.order-card-top{
align-items:flex-start;
flex-direction:column;
}

.order-badges{
justify-content:flex-start;
}

.order-customer{
grid-template-columns:1fr;
}

.order-control-grid{
grid-template-columns:1fr;
}

.item-row{
align-items:flex-start;
}

.item-total{
font-size:12px;
}

.admin-actions{
flex-direction:column;
}

.admin-actions .btn,
.admin-actions select{
width:100%;
}

.payment-filter{
overflow-x:auto;
}

}

/* =========================
TOAST
========================= */

.toast{
position:fixed;
right:18px;
bottom:18px;
background:#171717;
color:#fff;
padding:12px 16px;
border-radius:11px;
box-shadow:0 8px 30px rgba(0,0,0,.25);
z-index:9999;
font-size:13px;
font-weight:700;
opacity:0;
transform:translateY(15px);
pointer-events:none;
transition:.25s;
}

.toast.show{
opacity:1;
transform:translateY(0);
}

.toast.success{
background:#138a3c;
}

.toast.error{
background:#c62828;
}

</style>
</head>

<div>

<div class="header-title">
👨‍💼 Gadhuli Admin

</div>

</div>

</div>

<button

</header>

<div id="sectionContent">

<button

</div>


<footer>

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function money(value){

return Number(value || 0)
.toLocaleString(
"en-US",
{
maximumFractionDigits:2
}
);

}


function formatDate(value){

if(!value)
return "—";

try{

return new Date(value).toLocaleString(
"en-BD",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}catch(e){

return String(value);

}

}

async function adminLogin(){

const email=
document
.getElementById("loginEmail")
.value
.trim();

const password=
document
.getElementById("loginPassword")
.value;

const msg=
document.getElementById(
"loginMessage"
);

const button=
document.getElementById(
"loginButton"
);

if(!email || !password){

msg.innerHTML=
'<span style="color:#d32f2f">'+
"Email এবং Password দিন।"+
"</span>";

return;

}

button.disabled=true;
button.textContent="⏳ Login হচ্ছে...";

msg.innerHTML=
'<span style="color:#777">'+
"Supabase যাচাই করছে..."+
"</span>";

try{

const r=
await db.auth.signInWithPassword({
email:email,
password:password
});

if(r.error){

msg.innerHTML=
'<span style="color:#d32f2f">'+
esc(r.error.message)+
"</span>";

return;

}

if(!r.data?.user){

msg.innerHTML=
'<span style="color:#d32f2f">'+
"Supabase User পাওয়া যায়নি।"+
"</span>";

return;

}

if(
String(currentUser.email || "")
.toLowerCase()
!==

){

await db.auth.signOut();

currentUser=null;

msg.innerHTML=
'<span style="color:#d32f2f">'+
"এই Email-এর Admin access নেই।"+
"</span>";

}

currentUser=null;

"Admin Login Check Failed ❌"+
"</div>"+

"</div>";

return;

}

msg.innerHTML=
'<span style="color:#138a3c;font-weight:bold">'+
"Admin Login Successful ✅"+
"</span>";

showAdmin();

}catch(error){

console.error("LOGIN ERROR:",error);

'<span style="color:#d32f2f">'+
esc(error.message || error)+
"</span>";

}finally{

button.disabled=false;
button.textContent="🔐 Login";

}

}

/* =====================================================
SAVE PRODUCT
===================================================== */

async function saveProduct(){

const name=
document
.getElementById("productName")
.value
.trim();

const price=
Number(
document
.getElementById("productPrice")
.value
);

const category=
document
.getElementById("productCategory")
.value;

const subcategory=
document
.getElementById("productSubcategory")
.value;

const description=
document
.getElementById("productDescription")
.value
.trim();

const input=
document.getElementById("productImages");

const files=
Array.from(input.files || []);

if(
!name ||
price<=0 ||
!category ||
!files.length
){

alert(
"Product Name, Price, Category এবং Image দিন।"
);

return;

}

if(files.length>5){

alert(
"Maximum 5টি ছবি দেওয়া যাবে।"
);

return;

}

const sizes=
Array.from(
document.querySelectorAll(
".size-check:checked"
)
)
.map(x=>x.value);

const button=
document.getElementById(
"saveProductButton"
);

try{

button.disabled=true;
button.textContent="⏳ Uploading...";

const urls=[];

for(
const file of files
){

const safe=
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const path=
"products/"+
Date.now()+
"-"+
Math.random()
.toString(36)
.substring(2,8)+
"-"+
safe;

const upload=
await db.storage
.from("product-images")
.upload(
path,
file,
{
upsert:false
}
);

if(upload.error)
throw upload.error;

const pub=
db.storage
.from("product-images")
.getPublicUrl(path);

urls.push(
pub.data.publicUrl
);

}

const r=
await db
.from("products")
.insert({

name:name,
price:price,
category:category,
subcategory:subcategory,
sizes:sizes,
description:description,
images:urls

});

if(r.error)
throw r.error;

alert(
"Product Save হয়েছে ✅"
);

await loadStats();

await showSection("products");

}catch(error){

console.error(error);

alert(
"Product Save হয়নি ❌\n\n"+
(error.message || error)
);

}finally{

button.disabled=false;
button.textContent="💾 Save Product";

}

}

<div class="empty">

⭐ কোনো Review নেই।

</div>

`;

return;

}

box.innerHTML=
r.data
.map(
review=>`

<div class="review-card">

<b>
${esc(
review.user_name ||
"Customer"
)}
</b>

<br>

<span>

${
"⭐".repeat(
Math.min(
5,
Number(
review.rating || 0
)
)
)
}

</span>

<p style="margin-top:7px">

${esc(
review.review_text ||
""
)}

</p>

<p style="margin-top:7px">

Status:

<span class="status">

${esc(
review.status ||
"Pending"
)}

</span>

</p>

<div class="admin-actions">

<button
type="button"
class="btn btn-orange review-approve"
>
✅ Approve
</button>

<button
type="button"
class="btn btn-danger review-reject"
>
❌ Reject
</button>

</div>

</div>

`
)
.join("");

const cards=
box.querySelectorAll(
".review-card"
);

cards.forEach(
(card,index)=>{

const review=
r.data[index];

card
.querySelector(".review-approve")
.addEventListener(
"click",
()=>updateReview(
review.id,
"Approved"
)
);

card
.querySelector(".review-reject")
.addEventListener(
"click",
()=>updateReview(
review.id,
"Rejected"
)
);

});

}


/* =====================================================
UPDATE REVIEW
===================================================== */

async function updateReview(
id,
status
){

const r=
await db
.from("reviews")
.update({
status:status
})
.eq(
"id",
id
);

if(r.error){

alert(
"Review update হয়নি ❌\n\n"+
r.error.message
);

return;

}

await renderReviews();

}


/* =====================================================
EVENTS
===================================================== */

function setupEvents(){

document
.querySelectorAll(
".admin-nav [data-section]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

showSection(
this.getAttribute(
"data-section"
)
);

}
);

});


document
.getElementById(
"refreshButton"
)
.addEventListener(
"click",
refreshAdmin
);


document
.getElementById(
"websiteButton"
)
.addEventListener(
"click",
goHome
);


document
.getElementById(
"loginButton"
)
.addEventListener(
"click",
adminLogin
);


document
.getElementById(
"passwordEye"
)
.addEventListener(
"click",
togglePassword
);


document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
adminLogout
);


document
.getElementById(
"loginPassword"
)
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter")
adminLogin();

});


document
.getElementById(
"loginEmail"
)
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter")
adminLogin();

});

}


/* =====================================================
START
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

setupEvents();

checkSession();

});

</script>
