<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gadhuli | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#333;
}

header{
  background:linear-gradient(135deg,#8f174d,#d52b72);
  color:white;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:8px;
  background:white;
}

.logo h1{
  font-size:22px;
}

.back{
  color:white;
  text-decoration:none;
  font-weight:bold;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.5);
  border-radius:8px;
}

.back:hover{
  background:rgba(255,255,255,.15);
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(143,23,77,.08);
}

.card h2{
  color:#8f174d;
  margin-bottom:18px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
  outline:none;
  background:white;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#8f174d;
}

textarea{
  resize:vertical;
}

label{
  font-weight:bold;
  color:#555;
  display:block;
  margin-top:5px;
}

button{
  border:none;
  border-radius:8px;
  padding:11px 16px;
  background:#8f174d;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#6f103b;
}

.btn-danger{
  background:#c62828;
}

.btn-danger:hover{
  background:#9e1f1f;
}

.btn-secondary{
  background:#777;
}

.btn-secondary:hover{
  background:#555;
}

.hidden{
  display:none !important;
}

.message{
  padding:10px;
  border-radius:8px;
  margin-bottom:12px;
  display:none;
}

.success{
  background:#e8f5e9;
  color:#2e7d32;
}

.error{
  background:#ffebee;
  color:#c62828;
}

.category-help{
  background:#fff7fa;
  border-left:4px solid #8f174d;
  padding:10px 12px;
  border-radius:6px;
  margin-bottom:12px;
  color:#666;
  font-size:13px;
}


/* ========================= */
/* SIZE SECTION */
/* ========================= */

.size-section{
  display:none;
  background:#fff7fa;
  border:1px solid #efbfd1;
  border-radius:10px;
  padding:13px;
  margin:5px 0 15px;
}

.size-section.show{
  display:block;
}

.size-title{
  color:#8f174d;
  font-weight:bold;
  margin-bottom:10px;
}

.size-help{
  color:#777;
  font-size:12px;
  margin-bottom:10px;
}

.size-options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.size-option{
  position:relative;
}

.size-option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.size-option label{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:52px;
  padding:9px 12px;
  margin:0;
  border:1px solid #e2a8be;
  border-radius:8px;
  background:white;
  color:#8f174d;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
  transition:.15s;
}

.size-option input:checked + label{
  background:#8f174d;
  color:white;
  border-color:#8f174d;
}

.no-size-box{
  background:#f4e7ed;
  color:#6f103b;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}


/* ========================= */
/* PREVIEW */
/* ========================= */

.preview{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:10px 0 15px;
}

.preview-item{
  position:relative;
}

.preview img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid #eee;
}


/* ========================= */
/* PRODUCT LIST */
/* ========================= */

.product{
  border:1px solid #eee;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
}

.product-info{
  flex:1;
}

.product-info h3{
  color:#8f174d;
  margin-bottom:5px;
}

.category-text{
  color:#8f174d;
  font-weight:bold;
  margin-top:5px;
}

.subcategory-text{
  color:#777;
  font-size:13px;
  margin-top:3px;
}

.size-text{
  color:#6f103b;
  font-size:13px;
  font-weight:bold;
  margin-top:5px;
}

.product-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.small{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.logout{
  margin-top:15px;
}

#loginSection{
  max-width:450px;
  margin:60px auto;
}


/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:600px){

  header{
    padding:12px;
  }

  .logo h1{
    font-size:19px;
  }

  .logo img{
    width:36px;
    height:36px;
  }

  .product{
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .product img{
    width:75px;
    height:75px;
  }

  .product-actions{
    width:100%;
    margin-top:8px;
  }

  button{
    font-size:14px;
    padding:10px 12px;
  }

  .size-option label{
    min-width:48px;
    padding:8px 10px;
  }

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header>

  <div class="logo">

    <img
      src="logo.png"
      alt="Gadhuli"
    >

    <h1>
      Gadhuli Admin
    </h1>

  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Website
  </a>

</header>


<div class="container">


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<section
  id="loginSection"
  class="card"
>

  <h2>
    🔐 Admin Login
  </h2>

  <div
    id="loginMessage"
    class="message"
  ></div>

  <form id="loginForm">

    <label>
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      required
    >

    <label>
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

</section>


<!-- ========================= -->
<!-- ADMIN PANEL -->
<!-- ========================= -->

<section
  id="adminPanel"
  class="hidden"
>


<!-- ========================= -->
<!-- ADD PRODUCT -->
<!-- ========================= -->

<div class="card">

  <h2>
    ➕ Add New Product
  </h2>

  <div
    id="productMessage"
    class="message"
  ></div>

  <form id="productForm">


    <!-- PRODUCT NAME -->

    <label>
      Product Name
    </label>

    <input
      type="text"
      id="productName"
      placeholder="Product Name"
      required
    >


    <!-- PRICE -->

    <label>
      Price (৳)
    </label>

    <input
      type="number"
      id="productPrice"
      placeholder="Product Price"
      min="0"
      required
    >


    <!-- CATEGORY -->

    <label>
      🏷️ Category
    </label>

    <select
      id="productCategory"
      required
    >

      <option value="">
        Select Category
      </option>

      <option value="Men's Fashion">
        Men's Fashion
      </option>

      <option value="Women's Fashion">
        Women's Fashion
      </option>

      <option value="Kids & Baby">
        Kids & Baby
      </option>

      <option value="Shoes">
        Shoes
      </option>

      <option value="Bags & Accessories">
        Bags & Accessories
      </option>

      <option value="Watches">
        Watches
      </option>

      <option value="Electronics">
        Electronics
      </option>

      <option value="Beauty & Personal Care">
        Beauty & Personal Care
      </option>

      <option value="Home & Living">
        Home & Living
      </option>

    </select>


    <!-- SUBCATEGORY -->

    <label>
      📂 Subcategory
    </label>

    <select
      id="productSubcategory"
      required
      disabled
    >

      <option value="">
        First Select Category
      </option>

    </select>

    <div class="category-help">

      💡 আগে Category select করো।
      তারপর সেই Category-এর Subcategory আসবে।

    </div>


    <!-- SIZE -->

    <div
      id="sizeSection"
      class="size-section"
    >

      <div class="size-title">
        📏 Product Size
      </div>

      <div
        id="sizeHelp"
        class="size-help"
      ></div>

      <div
        id="sizeOptions"
        class="size-options"
      ></div>

    </div>


    <!-- DESCRIPTION -->

    <label>
      📝 Description
    </label>

    <textarea
      id="productDescription"
      rows="4"
      placeholder="Product description"
    ></textarea>


    <!-- IMAGES -->

    <label>
      🖼️ Product Images (1–5)
    </label>

    <input
      type="file"
      id="images"
      accept="image/*"
      multiple
      required
    >

    <div
      id="preview"
      class="preview"
    ></div>


    <!-- SAVE -->

    <button type="submit">
      💾 Save Product
    </button>

  </form>

</div>


<!-- ========================= -->
<!-- MANAGE PRODUCTS -->
<!-- ========================= -->

<div class="card">

  <h2>
    📦 Manage Products
  </h2>

  <div id="productsList">
    Loading products...
  </div>

  <button
    type="button"
    id="logoutBtn"
    class="btn-secondary logout"
  >
    🚪 Logout
  </button>

</div>


</section>

</div>


<script>


/* =============================== */
/* SUPABASE */
/* =============================== */

const db =
  window.gadhuliSupabase;

const ADMIN_EMAIL =
  "hridoyff974@gmail.com";


/* =============================== */
/* CATEGORY DATA */
/* =============================== */

const CATEGORY_DATA = {

  "Men's Fashion":[
    "T-Shirt",
    "Polo T-Shirt",
    "Shirt",
    "Panjabi",
    "Jeans",
    "Pants",
    "Shorts",
    "Hoodie & Sweatshirt",
    "Jacket"
  ],

  "Women's Fashion":[
    "Saree",
    "Three Piece",
    "Kurti",
    "Tops",
    "T-Shirt",
    "Gown",
    "Hijab",
    "Abaya",
    "Women's Pants"
  ],

  "Kids & Baby":[
    "Boys Clothing",
    "Girls Clothing",
    "Baby Clothing",
    "Baby Accessories",
    "Toys"
  ],

  "Shoes":[
    "Men's Shoes",
    "Women's Shoes",
    "Kids Shoes",
    "Sneakers",
    "Sandals",
    "Slippers"
  ],

  "Bags & Accessories":[
    "Backpacks",
    "Handbags",
    "Wallets",
    "Belts",
    "Caps",
    "Sunglasses",
    "Fashion Accessories"
  ],

  "Watches":[
    "Men's Watches",
    "Women's Watches",
    "Smart Watches",
    "Kids Watches"
  ],

  "Electronics":[
    "Mobile Accessories",
    "Earphones & Headphones",
    "Speakers",
    "Chargers",
    "Power Banks",
    "Smart Gadgets"
  ],

  "Beauty & Personal Care":[
    "Skincare",
    "Hair Care",
    "Makeup",
    "Perfume",
    "Personal Care"
  ],

  "Home & Living":[
    "Home Decor",
    "Bedding",
    "Storage",
    "Lighting",
    "Kitchen & Dining"
  ]

};


/* =============================== */
/* SIZE DATA */
/* =============================== */

const SIZE_DATA = {

  "T-Shirt":[
    "S",
    "M",
    "L",
    "XL",
    "2XL",
    "4XL"
  ],

  "Polo T-Shirt":[
    "S",
    "M",
    "L",
    "XL",
    "2XL",
    "4XL"
  ],

  "Shirt":[
    "S",
    "M",
    "L",
    "XL",
    "2XL",
    "4XL"
  ],

  "Panjabi":[
    "28",
    "30",
    "32",
    "34",
    "36",
    "38",
    "40",
    "42",
    "44",
    "46",
    "48"
  ],

  "Pants":[
    "28",
    "30",
    "32",
    "34",
    "36",
    "38",
    "40"
  ],

  "Jeans":[
    "28",
    "30",
    "32",
    "34",
    "36",
    "38",
    "40"
  ]

};


/* =============================== */
/* MESSAGE */
/* =============================== */

function showMessage(
  id,
  text,
  type
){

  const box =
    document.getElementById(id);

  box.textContent =
    text;

  box.className =
    "message " + type;

  box.style.display =
    "block";
}


/* =============================== */
/* CATEGORY CHANGE */
/* =============================== */

document
.getElementById("productCategory")
.addEventListener(
  "change",
  function(){

    const category =
      this.value;

    const subcategory =
      document.getElementById(
        "productSubcategory"
      );

    subcategory.innerHTML =
      "";

    subcategory.disabled =
      true;

    showSizeOptions(
      "",
      ""
    );

    if(!category){

      subcategory.innerHTML = `

        <option value="">
          First Select Category
        </option>

      `;

      return;
    }

    subcategory.disabled =
      false;

    subcategory.innerHTML = `

      <option value="">
        Select Subcategory
      </option>

    `;

    const list =
      CATEGORY_DATA[category] || [];

    list.forEach(
      function(item){

        const option =
          document.createElement(
            "option"
          );

        option.value =
          item;

        option.textContent =
          item;

        subcategory.appendChild(
          option
        );

      }
    );

  }
);


/* =============================== */
/* SUBCATEGORY CHANGE */
/* =============================== */

document
.getElementById("productSubcategory")
.addEventListener(
  "change",
  function(){

    const category =
      document.getElementById(
        "productCategory"
      ).value;

    const subcategory =
      this.value;

    showSizeOptions(
      category,
      subcategory
    );

  }
);


/* =============================== */
/* SHOW SIZE OPTIONS */
/* =============================== */

function showSizeOptions(
  category,
  subcategory
){

  const section =
    document.getElementById(
      "sizeSection"
    );

  const options =
    document.getElementById(
      "sizeOptions"
    );

  const help =
    document.getElementById(
      "sizeHelp"
    );

  options.innerHTML =
    "";

  help.textContent =
    "";

  section.classList.remove(
    "show"
  );


  /* ======================= */
  /* NO CATEGORY */
  /* ======================= */

  if(!category){

    return;

  }


  /* ======================= */
  /* WOMEN = NO SIZE */
  /* ======================= */

  if(
    category ===
    "Women's Fashion"
  ){

    return;

  }


  /* ======================= */
  /* WATCH = NO SIZE */
  /* ======================= */

  if(
    category ===
    "Watches"
  ){

    section.classList.add(
      "show"
    );

    help.textContent =
      "এই Category-এর Product-এ size select করার প্রয়োজন নেই।";

    options.innerHTML = `

      <div class="no-size-box">
        ⌚ No Size
      </div>

    `;

    return;

  }


  /* ======================= */
  /* SIZE DATA */
  /* ======================= */

  const sizes =
    SIZE_DATA[subcategory];


  if(
    !sizes ||
    sizes.length === 0
  ){

    return;

  }


  /* ======================= */
  /* SHOW SIZE */
  /* ======================= */

  section.classList.add(
    "show"
  );

  help.textContent =
    "যে যে size available আছে সেগুলো select করো।";


  sizes.forEach(
    function(size,index){

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "size-option";


      const id =
        "size_" +
        Date.now() +
        "_" +
        index;


      wrapper.innerHTML = `

        <input
          type="checkbox"
          id="${id}"
          value="${escapeHtml(size)}"
          class="product-size-checkbox"
        >

        <label for="${id}">
          ${escapeHtml(size)}
        </label>

      `;

      options.appendChild(
        wrapper
      );

    }
  );

}


/* =============================== */
/* LOGIN */
/* =============================== */

document
.getElementById("loginForm")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const email =
      document
      .getElementById("email")
      .value
      .trim();

    const password =
      document
      .getElementById("password")
      .value;

    try{

      const {
        data,
        error
      } =
        await db.auth
        .signInWithPassword({

          email:email,
          password:password

        });

      if(error){
        throw error;
      }

      if(!data.user){
        throw new Error(
          "Login failed"
        );
      }

      if(
        data.user.email !==
        ADMIN_EMAIL
      ){

        await db.auth.signOut();

        throw new Error(
          "এই account Admin নয়।"
        );

      }

      document
      .getElementById(
        "loginSection"
      )
      .classList
      .add("hidden");

      document
      .getElementById(
        "adminPanel"
      )
      .classList
      .remove("hidden");

      loadProducts();

    }
    catch(error){

      showMessage(
        "loginMessage",
        error.message ||
        "Login failed",
        "error"
      );

    }

  }
);


/* =============================== */
/* IMAGE PREVIEW */
/* =============================== */

document
.getElementById("images")
.addEventListener(
  "change",
  function(){

    const preview =
      document.getElementById(
        "preview"
      );

    preview.innerHTML =
      "";

    const files =
      Array.from(
        this.files
      );

    if(files.length > 5){

      alert(
        "Maximum 5 images allowed."
      );

      this.value =
        "";

      return;
    }

    files.forEach(
      function(file){

        const reader =
          new FileReader();

        reader.onload =
          function(e){

            const wrapper =
              document.createElement(
                "div"
              );

            wrapper.className =
              "preview-item";

            const img =
              document.createElement(
                "img"
              );

            img.src =
              e.target.result;

            wrapper.appendChild(
              img
            );

            preview.appendChild(
              wrapper
            );

          };

        reader.readAsDataURL(
          file
        );

      }
    );

  }
);


/* =============================== */
/* ADD PRODUCT */
/* =============================== */

document
.getElementById("productForm")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const name =
      document
      .getElementById(
        "productName"
      )
      .value
      .trim();


    const price =
      Number(
        document
        .getElementById(
          "productPrice"
        )
        .value
      );


    const category =
      document
      .getElementById(
        "productCategory"
      )
      .value;


    const subcategory =
      document
      .getElementById(
        "productSubcategory"
      )
      .value;


    const description =
      document
      .getElementById(
        "productDescription"
      )
      .value
      .trim();


    const files =
      Array.from(
        document
        .getElementById(
          "images"
        )
        .files
      );


    /* ========================= */
    /* GET SIZES */
    /* ========================= */

    let selectedSizes = [];


    if(
      category ===
      "Women's Fashion"
    ){

      selectedSizes =
        [];

    }

    else if(
      category ===
      "Watches"
    ){

      selectedSizes =
        [];

    }

    else if(
      SIZE_DATA[subcategory]
    ){

      selectedSizes =
        Array.from(
          document.querySelectorAll(
            ".product-size-checkbox:checked"
          )
        )
        .map(
          checkbox =>
            checkbox.value
        );

    }


    /* ========================= */
    /* VALIDATION */
    /* ========================= */

    if(!name){

      showMessage(
        "productMessage",
        "Product Name দিন।",
        "error"
      );

      return;
    }


    if(
      isNaN(price) ||
      price < 0
    ){

      showMessage(
        "productMessage",
        "সঠিক Price দিন।",
        "error"
      );

      return;
    }


    if(!category){

      showMessage(
        "productMessage",
        "Category select করুন।",
        "error"
      );

      return;
    }


    if(!subcategory){

      showMessage(
        "productMessage",
        "Subcategory select করুন।",
        "error"
      );

      return;
    }


    if(
      SIZE_DATA[subcategory] &&
      selectedSizes.length === 0
    ){

      showMessage(
        "productMessage",
        "কমপক্ষে একটি Size select করুন।",
        "error"
      );

      return;
    }


    if(
      files.length < 1 ||
      files.length > 5
    ){

      showMessage(
        "productMessage",
        "Please select 1–5 images.",
        "error"
      );

      return;
    }


    try{

      showMessage(
        "productMessage",
        "Product save হচ্ছে... ⏳",
        "success"
      );


      /* ========================= */
      /* UPLOAD IMAGES */
      /* ========================= */

      const imageUrls = [];


      for(
        let i = 0;
        i < files.length;
        i++
      ){

        const file =
          files[i];

        const extension =
          file.name
          .split(".")
          .pop();

        const fileName =
          Date.now() +
          "-" +
          Math.random()
          .toString(36)
          .substring(2) +
          "." +
          extension;

        const filePath =
          "products/" +
          fileName;


        const {
          error:uploadError
        } =
          await db.storage
          .from(
            "product-images"
          )
          .upload(
            filePath,
            file,
            {
              cacheControl:"3600",
              upsert:false
            }
          );


        if(uploadError){

          throw uploadError;

        }


        const {
          data:urlData
        } =
          db.storage
          .from(
            "product-images"
          )
          .getPublicUrl(
            filePath
          );


        imageUrls.push(
          urlData.publicUrl
        );

      }


      /* ========================= */
      /* DATABASE SAVE */
      /* ========================= */

      const {
        error:insertError
      } =
        await db
        .from("products")
        .insert([

          {
            name:name,
            price:price,
            category:category,
            subcategory:subcategory,
            sizes:selectedSizes,
            description:description,
            images:imageUrls
          }

        ]);


      if(insertError){

        throw insertError;

      }


      /* ========================= */
      /* SUCCESS */
      /* ========================= */

      showMessage(
        "productMessage",
        "✅ Product successfully saved!",
        "success"
      );


      document
      .getElementById(
        "productForm"
      )
      .reset();


      document
      .getElementById(
        "preview"
      )
      .innerHTML =
        "";


      document
      .getElementById(
        "productSubcategory"
      )
      .disabled =
        true;


      document
      .getElementById(
        "productSubcategory"
      )
      .innerHTML = `

        <option value="">
          First Select Category
        </option>

      `;


      document
      .getElementById(
        "sizeSection"
      )
      .classList
      .remove("show");


      document
      .getElementById(
        "sizeOptions"
      )
      .innerHTML =
        "";


      loadProducts();

    }
    catch(error){

      console.error(error);

      showMessage(
        "productMessage",
        "❌ Product Save হয়নি: " +
        (
          error.message ||
          "Unknown error"
        ),
        "error"
      );

    }

  }
);


/* =============================== */
/* LOAD PRODUCTS */
/* =============================== */

async function loadProducts(){

  const list =
    document.getElementById(
      "productsList"
    );

  list.innerHTML =
    "Loading products... ⏳";


  try{

    const {
      data,
      error
    } =
      await db
      .from("products")
      .select("*")
      .order(
        "id",
        {
          ascending:false
        }
      );


    if(error){
      throw error;
    }


    if(
      !data ||
      data.length === 0
    ){

      list.innerHTML =
        "<p>No products found.</p>";

      return;
    }


    list.innerHTML =
      "";


    data.forEach(
      function(product){

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "product";


        let imageUrl =
          "https://via.placeholder.com/90";


        if(
          Array.isArray(
            product.images
          ) &&
          product.images.length > 0
        ){

          imageUrl =
            product.images[0];

        }


        const category =
          product.category ||
          "Others";


        const subcategory =
          product.subcategory ||
          "";


        let sizes = [];


        if(
          Array.isArray(
            product.sizes
          )
        ){

          sizes =
            product.sizes;

        }


        const sizeText =
          sizes.length
          ?
          sizes.join(", ")
          :
          (
            category === "Watches"
            ?
            "No Size"
            :
            (
              category ===
              "Women's Fashion"
              ?
              "No Size"
              :
              "Not Applicable"
            )
          );


        item.innerHTML = `

          <img
            src="${escapeHtml(
              imageUrl
            )}"
            alt="${escapeHtml(
              product.name ||
              "Product"
            )}"
            onerror="
              this.src='https://via.placeholder.com/90?text=Gadhuli'
            "
          >

          <div class="product-info">

            <h3>
              ${escapeHtml(
                product.name ||
                ""
              )}
            </h3>

            <p>
              ৳${Number(
                product.price ||
                0
              )}
            </p>

            <p class="category-text">
              🏷️
              ${escapeHtml(
                category
              )}
            </p>

            ${
              subcategory
              ?
              `
                <p class="subcategory-text">
                  📂
                  ${escapeHtml(
                    subcategory
                  )}
                </p>
              `
              :
              ""
            }

            <p class="size-text">
              📏 Size:
              ${escapeHtml(
                sizeText
              )}
            </p>

          </div>

          <div class="product-actions">

            <button
              type="button"
              class="btn-secondary"
              onclick="editProduct('${escapeHtml(
                product.id
              )}')"
            >
              ✏️ Edit
            </button>

            <button
              type="button"
              class="btn-danger"
              onclick="deleteProduct('${escapeHtml(
                product.id
              )}')"
            >
              🗑️ Delete
            </button>

          </div>

        `;

        list.appendChild(
          item
        );

      }
    );

  }
  catch(error){

    console.error(error);

    list.innerHTML =
      "<p style='color:#c62828'>" +
      "Products load হয়নি: " +
      escapeHtml(
        error.message ||
        ""
      ) +
      "</p>";

  }

}

/* =============================== */
/* DELETE PRODUCT */
/* =============================== */

window.deleteProduct =
  async function(id){

    const confirmDelete =
      confirm(
        "এই Product টি Delete করতে চান?"
      );


    if(!confirmDelete){
      return;
    }


    try{

      const {
        error
      } =
        await db
        .from("products")
        .delete()
        .eq(
          "id",
          id
        );


      if(error){
        throw error;
      }


      alert(
        "Product deleted successfully. ✅"
      );


      loadProducts();

    }
    catch(error){

      alert(
        "Delete হয়নি: " +
        (
          error.message ||
          "Unknown error"
        )
      );

    }

  };

/* =============================== */
/* ESCAPE HTML */
/* =============================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

    const {
      data
    } =

    if(

      data.session &&
      data.session.user &&
      data.session.user.email ===

      .getElementById(
        "loginSection"
      )
      .classList
      .add("hidden");


      document
      .getElementById(
        "adminPanel"
      )
      .classList
      .remove("hidden");


      loadProducts();

    }

  }
  catch(error){

    console.error(error);

  }

})();
