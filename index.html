/* =====================================================
   RESET
   ===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --orange:#FF6B00;
  --dark-orange:#E65100;
  --orange-2:#FF8A00;
  --light-orange:#FFF3E8;
  --lighter-orange:#FFF9F4;
  --gradient:linear-gradient(135deg,#FF8A00,#FF5A00);
  --white:#fff;
  --offwhite:#FFFDF9;
  --text:#171717;
  --gray:#666;
  --light-gray:#EEEEEE;
  --green:#25D366;
  --danger:#e53935;
  --success:#16a34a;
  --shadow:0 5px 20px rgba(0,0,0,.08);
  --radius:14px;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--offwhite);
  color:var(--text);
  padding-bottom:92px;
}

body.modal-open{
  overflow:hidden;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:none;
}

button:disabled{
  cursor:not-allowed;
  opacity:.65;
}

img{
  max-width:100%;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =====================================================
   GLOBAL LOADER
   ===================================================== */

.global-loader{
  position:fixed;
  inset:0;
  background:rgba(255,253,249,.98);
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.global-loader.show{
  display:flex;
}

.loader-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:210px;
}

.loader-logo{
  width:160px;
  height:75px;
  object-fit:contain;
  margin-bottom:18px;
}

.loader-spinner{
  width:40px;
  height:40px;
  border:4px solid #ffe0c7;
  border-top-color:var(--orange);
  border-radius:50%;
  animation:gadhuliSpin .8s linear infinite;
}

.loader-text{
  margin-top:12px;
  color:var(--orange);
  font-size:15px;
  font-weight:700;
}

@keyframes gadhuliSpin{
  to{
    transform:rotate(360deg);
  }
}

   HEADER

  height:58px;
  display:flex;
  align-items:center;

  height:48px;
  object-fit:contain;
  display:block;
}

.logo-text{
  margin-left:9px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:24px;
  font-weight:700;
  color:#111;
  letter-spacing:0;
  white-space:nowrap;
}

  background:#fff;

  color:#fff;
  font-size:20px;
}
