<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta
  name="google-site-verification"
  content="lkVxExaUcJinZDbyNwrJL4Jhc3kjkYTwQXLFYYKu_p8"
>

<title>Gadhuli | Official Website</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff7fa;
  color:#222;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:2px solid #f0b3cc;
  box-shadow:0 2px 12px rgba(143,23,77,.12);
}

.header-top{
  max-width:1200px;
  margin:auto;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:130px;
  height:45px;
  object-fit:contain;
}

.search-box{
  flex:1;
}

.search-box input{
  width:100%;
  padding:12px 15px;
  border:2px solid #f0b3cc;
  border-radius:25px;
  outline:none;
  background:#fff7fa;
  font-size:14px;
}

.search-box input:focus{
  border-color:#8f174d;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  border:1px solid #f0b3cc;
  background:#fff;
  color:#8f174d;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:19px;
}

.icon-btn:hover{
  background:#fff0f6;
}

.hero{
  max-width:1200px;
  margin:15px auto;
  padding:28px 20px;
  border-radius:18px;
  background:linear-gradient(135deg,#8f174d,#d52b72,#bd3475);
  color:white;
  text-align:center;
  box-shadow:0 6px 20px rgba(143,23,77,.2);
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  font-size:15px;
}

.section{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}

.section-title{
  color:#8f174d;
  font-size:21px;
  margin-bottom:12px;
}

.category-list,
.subcategory-list{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}

.category-list::-webkit-scrollbar,
.subcategory-list::-webkit-scrollbar{
  height:4px;
}

.category-list::-webkit-scrollbar-thumb,
.subcategory-list::-webkit-scrollbar-thumb{
  background:#d52b72;
  border-radius:10px;
}

.cat-btn,
.subcat-btn{
  white-space:nowrap;
  border:1px solid #f0b3cc;
  background:#fff;
  color:#8f174d;
  padding:9px 14px;
  border-radius:20px;
}

.cat-btn.active,
.subcat-btn.active,
.cat-btn:hover,
.subcat-btn:hover{
  background:#8f174d;
  color:white;
  border-color:#8f174d;
}

.subcategory-wrapper{
  display:none;
}

.subcategory-wrapper.show{
  display:block;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.product-card{
  background:#fff;
  border:1px solid #f0c4d6;
  border-radius:15px;
  overflow:hidden;
  position:relative;
  box-shadow:0 3px 10px rgba(143,23,77,.08);
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 7px 18px rgba(143,23,77,.15);
}

.product-image-wrap{
  position:relative;
}

.product-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#fff0f6;
}

.wish-small{
  position:absolute;
  right:8px;
  top:8px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:0;
  background:white;
  box-shadow:0 2px 8px #ddd;
  font-size:17px;
}

.product-info{
  padding:12px;
}

.product-name{
  font-size:15px;
  min-height:38px;
  font-weight:bold;
}

.product-price{
  color:#8f174d;
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.product-meta{
  color:#777;
  font-size:12px;
  margin-bottom:8px;
}

.product-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.product-buttons .btn{
  flex:1;
  min-width:80px;
}

.btn{
  border:0;
  padding:10px 12px;
  border-radius:9px;
  font-weight:bold;
}

.btn-pink{
  background:#8f174d;
  color:white;
}

.btn-pink:hover{
  background:#d52b72;
}

.btn-light{
  background:#fff0f6;
  color:#8f174d;
  border:1px solid #f0b3cc;
}

.btn-danger{
  background:#a20f48;
  color:white;
}

.btn-green{
  background:#25D366;
  color:white;
}

.btn-orange{
  background:#e67e22;
  color:white;
}

.full-btn{
  width:100%;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.55);
  padding:15px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  padding:20px;
  position:relative;
}

.modal-large{
  max-width:950px;
}

.close{
  position:absolute;
  right:12px;
  top:10px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:#fff0f6;
  color:#8f174d;
  font-size:20px;
}

.modal-title{
  color:#8f174d;
  margin-bottom:15px;
  padding-right:40px;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
  color:#555;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:11px;
  border:1px solid #f0b3cc;
  border-radius:9px;
  outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#8f174d;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #f0c4d6;
}

.cart-item img{
  width:75px;
  height:75px;
  border-radius:10px;
  object-fit:cover;
}

.cart-item-info{
  flex:1;
}

.qty-control{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty-control button{
  width:28px;
  height:28px;
  border:1px solid #f0b3cc;
  background:#fff0f6;
  color:#8f174d;
  border-radius:6px;
  font-weight:bold;
}

.summary{
  margin-top:15px;
  padding:15px;
  background:#fff0f6;
  border-radius:12px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
  gap:10px;
}

.summary-total{
  font-size:21px;
  font-weight:bold;
  color:#8f174d;
  border-top:1px solid #f0b3cc;
  padding-top:10px;
}

.detail-images{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
}

.detail-images img{
  width:250px;
  height:250px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #f0c4d6;
}

.size-list{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:10px 0;
}

.size-btn{
  padding:8px 13px;
  border:1px solid #f0b3cc;
  background:white;
  color:#8f174d;
  border-radius:8px;
}

.size-btn:hover,
.size-btn.active{
  background:#8f174d;
  color:white;
}

.account-card{
  background:#fff0f6;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.order-history-item{
  border:1px solid #f0c4d6;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  background:#fff;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:15px;
  background:#fff0f6;
  color:#8f174d;
  font-size:12px;
  font-weight:bold;
}

.review-card{
  border:1px solid #f0c4d6;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}

.stars{
  color:#d52b72;
  letter-spacing:2px;
}

.admin-order,
.reseller-admin-card{
  border:1px solid #f0b3cc;
  border-radius:13px;
  padding:14px;
  margin-bottom:12px;
  background:#fff;
}

.admin-order-head,
.reseller-admin-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.admin-items{
  background:#fff7fa;
  padding:10px;
  border-radius:9px;
  margin:8px 0;
}

.admin-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.admin-actions select{
  padding:8px;
  border:1px solid #f0b3cc;
  border-radius:8px;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#888;
}

.reseller-code{
  background:#fff;
  border:1px dashed #8f174d;
  color:#8f174d;
  padding:12px;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  margin:10px 0;
}

footer{
  margin-top:40px;
  background:#8f174d;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.footer-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:5px;
}

@media(max-width:900px){

  .product-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  .header-top{
    flex-wrap:wrap;
  }

  .logo{
    width:100px;
  }

  .search-box{
    order:3;
    flex-basis:100%;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-info{
    padding:9px;
  }

  .product-name{
    font-size:13px;
  }

  .product-price{
    font-size:17px;
  }

  .product-buttons{
    flex-direction:column;
  }

  .hero h1{
    font-size:25px;
  }

  .detail-images img{
    width:190px;
    height:190px;
  }

}

</style>

</head>

<body>

<header>

<div class="header-top">

<img
  src="logo.png"
  class="logo"
  alt="Gadhuli"
>

<div class="search-box">

<input
  id="searchInput"
  type="search"
  placeholder="🔎 Product, Category বা Size খুঁজুন..."
  oninput="handleSearch()"
>

</div>

<div class="header-actions">

<button
  class="icon-btn"
  onclick="openAccount()"
  title="Account"
>
👤
</button>

<button
  class="icon-btn"
  onclick="openWishlist()"
  title="Wishlist"
>
❤️
</button>

<button
  class="icon-btn"
  onclick="openCart()"
  title="Cart"
>
🛒
</button>

</div>

</div>

</header>

<section class="hero">

<h1>Gadhuli</h1>

<p>Shop Smart. Shop Easy.</p>

</section>

<section class="section">

<h2 class="section-title">
🛍️ Categories
</h2>

<div
  class="category-list"
  id="categoryList"
></div>

</section>

<section
  class="section subcategory-wrapper"
  id="subcategoryWrapper"
>

<h2 class="section-title">
📂 Subcategory
</h2>

<div
  class="subcategory-list"
  id="subcategoryList"
></div>

</section>

<section class="section">

<h2
  class="section-title"
  id="productTitle"
>
🛍️ All Products
</h2>

<div
  class="product-grid"
  id="productGrid"
>

<div class="empty">
Loading Products...
</div>

</div>

</section>

<!-- PRODUCT DETAILS -->

<div
  class="modal"
  id="detailModal"
>

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('detailModal')"
>
×
</button>

<h2
  class="modal-title"
  id="detailTitle"
>
Product
</h2>

<div
  class="detail-images"
  id="detailImages"
></div>

<div id="detailContent"></div>

<div id="productReviews"></div>

</div>

</div>

<!-- CART -->

<div
  class="modal"
  id="cartModal"
>

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('cartModal')"
>
×
</button>

<h2 class="modal-title">
🛒 My Cart
</h2>

<div id="cartContent"></div>

</div>

</div>

<!-- WISHLIST -->

<div
  class="modal"
  id="wishlistModal"
>

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('wishlistModal')"
>
×
</button>

<h2 class="modal-title">
❤️ Wishlist
</h2>

<div id="wishlistContent"></div>

</div>

</div>

<!-- CHECKOUT -->

<div
  class="modal"
  id="orderModal"
>

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('orderModal')"
>
×
</button>

<h2 class="modal-title">
📦 Checkout
</h2>

<div id="orderProducts"></div>

<div class="form-group">

<label>নাম *</label>

<input
  id="orderName"
  type="text"
  placeholder="আপনার নাম"
>

</div>

<div class="form-group">

<label>মোবাইল নম্বর *</label>

<input
  id="orderPhone"
  type="tel"
  placeholder="01XXXXXXXXX"
>

</div>

<div class="form-group">

<label>District *</label>

<input
  id="orderDistrict"
  type="text"
  placeholder="যেমন: Dhaka"
>

</div>

<div class="form-group">

<label>Thana / Upazila *</label>

<input
  id="orderThana"
  type="text"
  placeholder="যেমন: Tongi"
>

</div>

<div class="form-group">

<label>Receive Place / Address *</label>

<textarea
  id="orderReceivePlace"
  rows="3"
  placeholder="সম্পূর্ণ ঠিকানা"
></textarea>

</div>

<div class="form-group">

<label>Delivery Area</label>

<select
  id="deliveryArea"
  onchange="updateOrderTotal()"
>

<option value="Inside Dhaka">
Inside Dhaka — ৳60
</option>

<option value="Outside Dhaka">
Outside Dhaka — ৳120
</option>

</select>

</div>

<div class="form-group">

<label>Payment Method</label>

<select
  id="paymentMethod"
  onchange="togglePaymentFields()"
>

<option value="Cash on Delivery">
Cash on Delivery
</option>

<option value="bKash">
bKash
</option>

<option value="Nagad">
Nagad
</option>

</select>

</div>

<div
  id="manualPaymentFields"
  style="display:none;"
>

<div class="form-group">

<label>Payment Number</label>

<input
  id="paymentNumber"
  type="text"
  placeholder="যে নম্বর থেকে payment করেছেন"
>

</div>

<div class="form-group">

<label>Transaction ID</label>

<input
  id="transactionId"
  type="text"
  placeholder="Transaction ID"
>

</div>

</div>

<div class="summary">

<div id="orderSummary"></div>

</div>

<br>

<button
  id="placeOrderBtn"
  class="btn btn-pink full-btn"
  onclick="placeOrder()"
>
📦 Order Confirm করুন
</button>

</div>

</div>

<!-- AUTH -->

<div
  class="modal"
  id="authModal"
>

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('authModal')"
>
×
</button>

<h2
  class="modal-title"
  id="authTitle"
>
🔐 Login
</h2>

<div
  id="signupFields"
  style="display:none;"
>

<div class="form-group">

<label>Full Name</label>

<input
  id="signupName"
  type="text"
  placeholder="আপনার নাম"
>

</div>

<div class="form-group">

<label>Phone</label>

<input
  id="signupPhone"
  type="tel"
  placeholder="01XXXXXXXXX"
>

</div>

</div>

<div class="form-group">

<label>Email</label>

<input
  id="authEmail"
  type="email"
  placeholder="Email"
>

</div>

<div class="form-group">

<label>Password</label>

<input
  id="authPassword"
  type="password"
  placeholder="Password"
>

</div>

<button
  id="authSubmit"
  class="btn btn-pink full-btn"
  onclick="submitAuth()"
>
Login
</button>

<br><br>

<button
  class="btn btn-light full-btn"
  onclick="toggleAuthMode()"
  id="authToggle"
>
New Account তৈরি করুন
</button>

<br>

<button
  class="btn btn-light full-btn"
  onclick="resetPassword()"
>
Password Forgot?
</button>

</div>

</div>

<!-- ACCOUNT -->

<div
  class="modal"
  id="accountModal"
>

<div class="modal-box modal-large">

<button
  class="close"
  onclick="closeModal('accountModal')"
>
×
</button>

<h2 class="modal-title">
👤 My Account
</h2>

<div id="accountContent"></div>

</div>

</div>

<!-- REVIEW -->

<div
  class="modal"
  id="reviewModal"
>

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('reviewModal')"
>
×
</button>

<h2 class="modal-title">
⭐ Write Review
</h2>

<input
  type="hidden"
  id="reviewProductId"
>

<div class="form-group">

<label>Rating</label>

<select id="reviewRating">

<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>

</select>

</div>

<div class="form-group">

<label>Your Review</label>

<textarea
  id="reviewText"
  rows="5"
  placeholder="Product সম্পর্কে আপনার মতামত লিখুন..."
></textarea>

</div>

<button
  class="btn btn-pink full-btn"
  onclick="submitReview()"
>
⭐ Review Submit
</button>

</div>

</div>

<!-- RESELLER -->

<div
  class="modal"
  id="resellerModal"
>

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('resellerModal')"
>
×
</button>

<h2 class="modal-title">
🤝 Reseller Center
</h2>

<div id="resellerContent"></div>

</div>

</div>

<!-- ADMIN -->

<div
  class="modal"
  id="adminModal"
>

<div class="modal-box modal-large">

<button
  class="close"
  onclick="closeModal('adminModal')"
>
×
</button>

<h2 class="modal-title">
👨‍💼 Admin Panel
</h2>

<div
  id="adminContent"
></div>

</div>

</div>

<footer>

<div class="footer-title">
Gadhuli
</div>

<p>
Shop Smart. Shop Easy.
</p>

<br>

<p>
© 2026 Gadhuli. All Rights Reserved.
</p>

</footer>

<script>

/* =====================================================
   GLOBAL
===================================================== */

const db = window.gadhuliSupabase;

let products = [];

let wishlist =
JSON.parse(
  localStorage.getItem("gadhuli_wishlist") || "[]"
);

let cart =
JSON.parse(
  localStorage.getItem("gadhuli_cart") || "[]"
);

let currentOrderProducts = [];

let currentDetailProduct = null;

let currentCategory = "";

let currentSubcategory = "";

let currentUser = null;

let authMode = "login";

let currentReseller = null;

/* =====================================================
   PRODUCT SIZES
===================================================== */

function getProductSizes(product){

if(Array.isArray(product.sizes)){

return product.sizes;

}


if(typeof product.sizes === "string"){

try{

const parsed =
JSON.parse(product.sizes);

if(Array.isArray(parsed)){

return parsed;

}

}catch(e){}

}


if(Array.isArray(product.size)){

return product.size;

}


if(typeof product.size === "string"){

try{

const parsed =
JSON.parse(product.size);

if(Array.isArray(parsed)){

return parsed;

}

}catch(e){}

}


if(
product.subcategory &&
sizeData[product.subcategory]
){

return sizeData[
product.subcategory
];

}


return [];

}


/* =====================================================
   PRODUCT IMAGES
===================================================== */

function getProductImages(product){

const value =
product.images;


if(Array.isArray(value)){

return value.filter(Boolean);

}


if(typeof value === "string"){

try{

const parsed =
JSON.parse(value);

if(Array.isArray(parsed)){

return parsed.filter(Boolean);

}

if(
parsed &&
Array.isArray(parsed.urls)
){

return parsed.urls.filter(Boolean);

}

}catch(e){}


if(value.trim()){

return [value.trim()];

}

}


if(
value &&
typeof value === "object" &&
Array.isArray(value.urls)
){

return value.urls.filter(Boolean);

}


if(product.image){

return [product.image];

}


return [
"https://via.placeholder.com/500x500?text=Gadhuli"
];

}

/* =====================================================
   CART
===================================================== */

function normalizeCart(){

cart =
cart
.map(
function(item){

if(
typeof item === "string" ||
typeof item === "number"
){

return {

id:String(item),

size:"",

quantity:1

};

}


if(
item &&
typeof item === "object"
){

return {

id:String(item.id),

size:String(item.size || ""),

quantity:
Math.max(
1,
Number(item.quantity || 1)
)

};

}

return null;

}
)
.filter(Boolean);

saveCart();

}


function saveCart(){

localStorage.setItem(
"gadhuli_cart",
JSON.stringify(cart)
);

}


function addCartItem(product,size){

const id =
String(product.id);


const existing =
cart.find(
function(item){

return (
String(item.id) === id &&
String(item.size || "") ===
String(size || "")
);

}
);


if(existing){

existing.quantity =
Number(existing.quantity || 1) + 1;

}else{

cart.push({

id:id,

size:size || "",

quantity:1

});

}


saveCart();

alert(
"Cart-এ Product যোগ হয়েছে ✅"
);

}


function openCart(){

renderCart();

openModal("cartModal");

}


function renderCart(){

const box =
document.getElementById(
"cartContent"
);


if(!cart.length){

box.innerHTML =
`<div class="empty">
🛒 Cart খালি।
</div>`;

return;

}


let subtotal = 0;

let html = "";


cart.forEach(
function(item,index){

const product =
findProduct(item.id);

if(!product) return;


const price =
Number(product.price || 0);

const quantity =
Number(item.quantity || 1);

const line =
price * quantity;

subtotal += line;


const image =
getProductImages(product)[0];


html += `

<div class="cart-item">

src="${escapeAttr(image)}"
onerror="this.src='https://via.placeholder.com/100x100?text=Gadhuli'"
>

<div class="cart-item-info">

${escapeHtml(product.name)}
</b>

<div>
৳${formatMoney(price)}
</div>

${
item.size
?
`<small>
Size: ${escapeHtml(item.size)}
</small>`
:
""
}

<div class="qty-control">

<button
onclick="changeCartQuantity(${index},-1)"
>
−
</button>

<b>
${quantity}
</b>

onclick="changeCartQuantity(${index},1)"
>
+
</button>

<button

style="margin-left:10px;"
>
🗑️
</button>

</div>

</div>

<b>
৳${formatMoney(line)}
</b>

</div>

`;

}
);


html += `

<div class="summary">

৳${formatMoney(subtotal)}
</b>

<button
class="btn btn-pink full-btn"

`;


box.innerHTML =
html;

}


function changeCartQuantity(index,amount){

if(!cart[index]) return;


cart[index].quantity =
Number(cart[index].quantity || 1) +
amount;


if(cart[index].quantity <= 0){

cart.splice(index,1);

}


saveCart();

renderCart();

}


function removeCartItem(index){

cart.splice(index,1);

saveCart();

renderCart();

}

document.getElementById(
"orderThana"
).value.trim();

document.getElementById(
"orderReceivePlace"
).value.trim();


const deliveryArea =

"deliveryArea"
).value;

document.getElementById(
"paymentMethod"
).value;


if(
!name ||
!phone ||
!district ||
!thana ||
!address
){

);

}


let paymentNumber = "";

let transactionId = "";

){

"paymentNumber"

"transactionId"
).value.trim();


if(
!paymentNumber ||
!transactionId
){

alert(
"Payment Number এবং Transaction ID দিন।"
);

return;

}

}


const subtotal =
calculateOrderSubtotal();

const delivery =
deliveryArea ===
"Outside Dhaka"
? 120
: 60;

const total =
subtotal + delivery;


const button =
document.getElementById(
"placeOrderBtn"
);

button.disabled = true;

button.textContent =
"Order Save হচ্ছে...";


try{

let notes = "";


if(
paymentMethod !==
"Cash on Delivery"
){

notes =
"Payment Number: " +
paymentNumber +
"\nTransaction ID: " +
transactionId;

}


/* CHECK APPROVED REFERRAL */

const referralReseller =
await getReferralReseller();


const resellerCode =
referralReseller
?
referralReseller.reseller_code
:
"";


const resellerId =
referralReseller
?
referralReseller.user_id
:
null;


/* CREATE ORDER */

const orderResult =
await db
.from("orders")
.insert({

user_id:
currentUser.id,

customer_name:
name,

customer_phone:
phone,

customer_email:
currentUser.email || "",

customer_district:
district,

customer_thana:
thana,

customer_receive_place:
address,

delivery_area:
deliveryArea,

delivery_charge:
delivery,

subtotal:
subtotal,

total:
total,

payment_method:
paymentMethod,

payment_status:
"Pending",

order_status:
"Pending",

reseller_id:
resellerId,

reseller_code:
resellerCode,

notes:
notes

})
.select()
.single();


if(orderResult.error){

throw orderResult.error;

}


const order =
orderResult.data;


/* ORDER ITEMS */

const orderItems =
currentOrderProducts
.map(
function(item){

const product =
item.product;

const image =
getProductImages(product)[0] || "";


return {

order_id:
order.id,

product_id:
product.id,

product_name:
product.name || "Product",

product_image:
image,

size:
item.size || "",

quantity:
Number(item.quantity || 1),

unit_price:
Number(product.price || 0),

line_total:
Number(product.price || 0) *
Number(item.quantity || 1)

};

}
);


const itemsResult =
await db
.from("order_items")
.insert(orderItems);


if(itemsResult.error){

throw itemsResult.error;

}


/* REMOVE ORDERED ITEMS FROM CART */

currentOrderProducts
.forEach(
function(item){

const productId =
String(item.product.id);

const size =
String(item.size || "");


cart =
cart.filter(
function(cartItem){

return !(
String(cartItem.id) === productId &&
String(cartItem.size || "") === size
);

}
);

}
);


saveCart();


/* WHATSAPP COPY */

const whatsappItems =
currentOrderProducts.map(
function(item){

return {

name:item.product.name,

size:item.size,

quantity:item.quantity,

price:item.product.price

};

}
);

order.id

sendWhatsAppOrder(

district,

address,
deliveryArea,
subtotal,
delivery,
total,
paymentMethod,
resellerCode
);


currentOrderProducts = [];


}catch(error){

"Order Save হয়নি ❌\n\n" +
error.message
);

}finally{

button.disabled = false;

button.textContent =
"📦 Order Confirm করুন";

"Product পাওয়া যায়নি।"
);

return;

}


/* CREATE REFERRAL LINK */

const link =
window.location.origin +
window.location.pathname +
"?product=" +
encodeURIComponent(product.id) +
"&ref=" +
encodeURIComponent(
reseller.reseller_code
);


const message =
"🌸 Gadhuli Product\n\n" +

"🛍️ " +
(product.name || "Product") +
"\n" +

"💰 Price: ৳" +
formatMoney(product.price) +
"\n\n" +

"🛒 Order করতে এখানে দেখুন:\n" +
link;


/* NATIVE SHARE */

if(navigator.share){

try{

await navigator.share({

title:
"Gadhuli - " +
product.name,

text:
message,

url:
link

});

}catch(error){

console.log(
"Share cancelled."
);

}

}else{

/* WHATSAPP FALLBACK */

window.open(
"https://wa.me/?text=" +
encodeURIComponent(message),
"_blank"
);

}

}

/* =====================================================

===================================================== */

async function approveReseller(
userId,
resellerId
){

if(!await isCurrentAdmin()){

alert(
"Admin access নেই।"
);

return;

}


/* UPDATE RESELLER STATUS */

const resellerResult =
await db
.from("resellers")
.update({

status:"Approved"

})
.eq("id",resellerId);


if(resellerResult.error){

alert(
"Reseller approve হয়নি ❌\n\n" +
resellerResult.error.message
);

return;

}


/* UPDATE PROFILE ROLE */

const profileResult =
await db
.from("profiles")
.update({

role:"reseller"

})
.eq("id",userId);


if(profileResult.error){

alert(
"Profile role update হয়নি ❌\n\n" +
profileResult.error.message
);

return;

}


alert(
"Reseller Approved হয়েছে ✅"
);


await renderAdminResellers();

}

/* =====================================================
   HELPERS
===================================================== */

function findProduct(id){

return products.find(
function(product){

return String(product.id) ===
String(id);

}
);

}


function formatMoney(value){

return Number(
value || 0
).toLocaleString(
"en-US",
{
maximumFractionDigits:2
}
);

}


function formatDate(date){

if(!date) return "—";


try{

return new Date(date)
.toLocaleString(
"en-BD",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}catch(e){

return String(date);

}

}


function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttr(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll('"',"&quot;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}


/* =====================================================
   MODAL
===================================================== */

function openModal(id){

const modal =
document.getElementById(id);

if(modal){

modal.classList.add("show");

}

}


function closeModal(id){

const modal =
document.getElementById(id);

if(modal){

modal.classList.remove("show");

}

}


/* =====================================================
   OUTSIDE MODAL CLOSE
===================================================== */

document.addEventListener(
"click",
function(event){

if(
event.target.classList.contains("modal")
){

event.target.classList.remove("show");

}

}
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
"keydown",
function(event){

if(event.key === "Escape"){

document
.querySelectorAll(".modal.show")
.forEach(
function(modal){

modal.classList.remove("show");

}
);

}

}
);
