<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

  name="google-site-verification"
  content="lkVxExaUcJinZDbyNwrJL4Jhc3kjkYTwQXLFYYKu_p8"

<title>Gadhuli | Official Website</title>

<script src="supabase.js"></script>


<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#3b1024;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#8f174d;
  border-bottom:2px solid #6f103b;
  padding:10px 15px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  height:45px;
  width:auto;
  object-fit:contain;
}

.search-box{
  flex:1;
}

.search-box input{
  width:100%;
  padding:12px 16px;
  border:2px solid #d52b72;
  border-radius:25px;
  outline:none;
  font-size:15px;
}

.search-box input:focus{
  border-color:#ff5b9a;
}

.header-btns{
  display:flex;
  gap:7px;
}

.icon-btn{
  border:1px solid #d52b72;
  background:#a91d5b;
  color:#fff;
  padding:10px 12px;
  border-radius:20px;
  cursor:pointer;
  font-size:17px;
}

.icon-btn:hover{
  background:#d52b72;
}


/* HERO */

.hero{
  max-width:1200px;
  margin:18px auto;
  padding:38px 20px;
  text-align:center;
  border-radius:20px;

  background:linear-gradient(
    135deg,
    #5e0d32,
    #8f174d,
    #d52b72
  );

  color:#fff;

  box-shadow:
    0 6px 20px rgba(143,23,77,.25);
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  font-size:16px;
}


/* CONTAINER */

.container{
  max-width:1200px;
  margin:auto;
  padding:10px 15px 40px;
}

.section-title{
  font-size:24px;
  color:#8f174d;
  margin:15px 0;
}


/* ============================= */
/* MAIN CATEGORY */
/* ============================= */

.category-title{
  font-size:17px;
  color:#6f103b;
  margin:5px 0 8px;
  font-weight:bold;
}

.category-filter{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 2px 10px;
  margin-bottom:5px;
  scrollbar-width:none;
}

.category-filter::-webkit-scrollbar{
  display:none;
}

.category-btn{
  flex-shrink:0;

  border:1px solid #e9a9c2;
  background:#fff;
  color:#8f174d;

  padding:10px 16px;

  border-radius:22px;

  cursor:pointer;

  font-weight:bold;
  font-size:13px;

  white-space:nowrap;
}

.category-btn:hover{
  background:#f8d9e5;
}

.category-btn.active{
  background:#8f174d;
  color:#fff;
  border-color:#8f174d;
}


/* ============================= */
/* SUB CATEGORY */
/* ============================= */

.subcategory-wrapper{
  display:none;
  background:#fff;
  border:1px solid #efb4cb;
  border-radius:13px;

  padding:10px;

  margin:3px 0 13px;

  box-shadow:
    0 3px 12px rgba(143,23,77,.08);
}

.subcategory-wrapper.show{
  display:block;
}

.subcategory-title{
  color:#8f174d;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

.subcategory-list{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.subcategory-list::-webkit-scrollbar{
  display:none;
}

.subcategory-btn{
  flex-shrink:0;

  border:1px solid #e9a9c2;
  background:#fff7fa;
  color:#8f174d;

  padding:8px 12px;

  border-radius:18px;

  cursor:pointer;

  font-size:12px;
  font-weight:bold;

  white-space:nowrap;
}

.subcategory-btn:hover{
  background:#f8d9e5;
}

.subcategory-btn.active{
  background:#d52b72;
  color:#fff;
  border-color:#d52b72;
}


.selected-category{
  color:#8f174d;
  font-size:14px;
  margin:0 0 13px;
  font-weight:bold;
}


/* PRODUCTS */

.product-grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));

  gap:16px;
}

.product-card{
  background:#fff;

  border:1px solid #efb4cb;

  border-radius:16px;

  overflow:hidden;

  box-shadow:
    0 4px 15px rgba(143,23,77,.12);

  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);

  box-shadow:
    0 8px 22px rgba(143,23,77,.18);
}


/* PRODUCT IMAGE */

.product-image-box{
  position:relative;

  width:100%;
  height:230px;

  background:#f9e4ec;

  overflow:hidden;

  touch-action:pan-y;
}

.product-image{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  cursor:pointer;
}

.image-counter{
  position:absolute;

  top:9px;
  right:9px;

  background:#8f174d;
  color:#fff;

  padding:4px 9px;

  border-radius:15px;

  font-size:12px;
}

.slider-dots{
  position:absolute;

  bottom:8px;
  left:0;
  right:0;

  display:flex;

  justify-content:center;

  gap:5px;
}

.slider-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#fff;

  opacity:.55;

  box-shadow:
    0 1px 4px rgba(0,0,0,.3);
}

.slider-dot.active{
  opacity:1;
  transform:scale(1.25);
}


/* PRODUCT INFO */

.product-info{
  padding:13px;
}

.product-name{
  font-size:17px;

  font-weight:bold;

  margin-bottom:7px;

  color:#3b1024;
}

.price{
  color:#8f174d;

  font-size:19px;

  font-weight:bold;

  margin-bottom:10px;
}

.product-category{
  display:inline-block;

  background:#f8d9e5;

  color:#8f174d;

  padding:4px 8px;

  border-radius:20px;

  font-size:11px;

  font-weight:bold;

  margin-bottom:5px;
}

.product-subcategory{
  display:inline-block;

  background:#fff0f5;

  color:#6f103b;

  padding:4px 8px;

  border-radius:20px;

  font-size:11px;

  font-weight:bold;

  margin-bottom:10px;

  margin-left:3px;
}


/* BUTTONS */

.card-actions{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;
}

.btn{
  border:0;

  border-radius:9px;

  padding:10px 8px;

  cursor:pointer;

  font-weight:bold;

  font-size:13px;
}

.btn-primary{
  background:#8f174d;
  color:#fff;
}

.btn-primary:hover{
  background:#6f103b;
}

.btn-light{
  background:#f8d9e5;

  color:#8f174d;

  border:1px solid #e9a9c2;
}

.btn-light:hover{
  background:#f1bfd2;
}

.btn-green{
  background:#25d366;
  color:#fff;
}

.full-btn{
  grid-column:1/-1;
}


/* EMPTY / LOADING */

.empty{
  text-align:center;

  padding:50px 15px;

  color:#8f174d;

  grid-column:1/-1;
}

.loading{
  text-align:center;

  padding:40px;

  color:#8f174d;

  grid-column:1/-1;
}


/* MODAL */

.modal{
  display:none;

  position:fixed;

  inset:0;

  z-index:2000;

  background:rgba(50,0,25,.72);

  padding:20px;

  overflow:auto;
}

.modal-box{
  background:#fff;

  max-width:600px;

  margin:30px auto;

  border-radius:18px;

  padding:20px;

  position:relative;

  border-top:5px solid #8f174d;

  box-shadow:
    0 10px 35px rgba(0,0,0,.25);
}

.close{
  position:absolute;

  top:10px;
  right:14px;

  border:0;

  background:#f8d9e5;

  color:#8f174d;

  width:35px;
  height:35px;

  border-radius:50%;

  cursor:pointer;

  font-size:20px;
}

.modal-title{
  color:#8f174d;

  margin-bottom:15px;

  padding-right:40px;
}


/* DETAILS */

.detail-main-image{
  width:100%;

  height:320px;

  object-fit:contain;

  background:#fff7fa;

  border-radius:12px;

  border:1px solid #f0c1d2;
}

.thumbnails{
  display:flex;

  gap:7px;

  overflow-x:auto;

  margin-top:10px;
}

.thumb{
  width:65px;
  height:65px;

  object-fit:cover;

  border:2px solid transparent;

  border-radius:8px;

  cursor:pointer;
}

.thumb.active{
  border-color:#8f174d;
}


/* FORM */

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;

  margin-bottom:5px;

  font-weight:bold;

  color:#6f103b;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;

  padding:11px;

  border:1px solid #e3a5bd;

  border-radius:9px;

  outline:none;

  background:#fff;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:#8f174d;
}

.form-group textarea{
  min-height:90px;

  resize:vertical;
}


/* CART */

.cart-item{
  display:flex;

  gap:10px;

  align-items:center;

  padding:10px 0;

  border-bottom:1px solid #f0cbd9;
}

.cart-item img{
  width:65px;
  height:65px;

  object-fit:cover;

  border-radius:8px;
}

.cart-info{
  flex:1;
}

.total-box{
  margin-top:15px;

  padding:15px;

  background:#fff0f5;

  border-left:4px solid #8f174d;

  border-radius:10px;
}


/* SHARE */

.share-buttons{
  display:grid;

  gap:10px;

  margin-top:15px;
}

.share-btn{
  padding:12px;

  border:0;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;
}

.facebook{
  background:#1877f2;
  color:#fff;
}

.whatsapp{
  background:#25d366;
  color:#fff;
}

.copy{
  background:#8f174d;
  color:#fff;
}

.copy:hover{
  background:#6f103b;
}


/* MOBILE */

@media(max-width:600px){

  .header-inner{
    flex-wrap:wrap;
  }

  .search-box{
    order:3;
    flex-basis:100%;
  }

  .logo{
    max-width:130px;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);

    gap:10px;
  }

  .product-image-box{
    height:180px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .btn{
    font-size:11px;

    padding:9px 5px;
  }

  .hero h1{
    font-size:25px;
  }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

  <div class="header-inner">

    <img
      src="logo.png"
      class="logo"
      alt="Gadhuli"
    >

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="🔎 Product খুঁজুন..."
        oninput="searchProducts()"
      >

    </div>

    <div class="header-btns">

      <button
        class="icon-btn"
        type="button"
        onclick="openWishlist()"
      >
        ❤️
      </button>

      <button
        class="icon-btn"
        type="button"
        onclick="openCart()"
      >
        🛒
      </button>

    </div>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <h1>Gadhuli</h1>

  <p>
    Shop Smart. Shop Easy. 🌸
  </p>

</section>


<!-- PRODUCTS -->

<main class="container">

  <h2 class="section-title">
    🛍️ Our Products
  </h2>


  <!-- MAIN CATEGORY -->

  <div class="category-title">
    📂 Categories
  </div>

  <div
    class="category-filter"
    id="categoryFilter"
  >

    <button
      class="category-btn active"
      data-category=""
      onclick="setCategory('')"
    >
      All
    </button>

    <button
      class="category-btn"
      data-category="Men's Fashion"
      onclick="setCategory(&quot;Men's Fashion&quot;)"
    >
      👔 Men's Fashion
    </button>

    <button
      class="category-btn"
      data-category="Women's Fashion"
      onclick="setCategory(&quot;Women's Fashion&quot;)"
    >
      👗 Women's Fashion
    </button>

    <button
      class="category-btn"
      data-category="Kids & Baby"
      onclick="setCategory('Kids & Baby')"
    >
      👶 Kids & Baby
    </button>

    <button
      class="category-btn"
      data-category="Shoes"
      onclick="setCategory('Shoes')"
    >
      👟 Shoes
    </button>

    <button
      class="category-btn"
      data-category="Bags & Accessories"
      onclick="setCategory('Bags & Accessories')"
    >
      🎒 Bags & Accessories
    </button>

    <button
      class="category-btn"
      data-category="Watches"
      onclick="setCategory('Watches')"
    >
      ⌚ Watches
    </button>

    <button
      class="category-btn"
      data-category="Electronics"
      onclick="setCategory('Electronics')"
    >
      📱 Electronics
    </button>

    <button
      class="category-btn"
      data-category="Beauty & Personal Care"
      onclick="setCategory('Beauty & Personal Care')"
    >
      💄 Beauty & Personal Care
    </button>

    <button
      class="category-btn"
      data-category="Home & Living"
      onclick="setCategory('Home & Living')"
    >
      🏠 Home & Living
    </button>

  </div>


  <!-- SUBCATEGORY -->

  <div
    id="subcategoryWrapper"
    class="subcategory-wrapper"
  >

    <div
      id="subcategoryTitle"
      class="subcategory-title"
    >
      Subcategories
    </div>

    <div
      id="subcategoryList"
      class="subcategory-list"
    ></div>

  </div>


  <div
    id="selectedCategory"
    class="selected-category"
  >
    🏷️ Showing: All Categories
  </div>


  <!-- PRODUCT GRID -->

  <div
    id="productGrid"
    class="product-grid"
  >

    <div class="loading">
      Products loading... ⏳
    </div>

  </div>

</main>


<!-- DETAILS MODAL -->

<div
  class="modal"
  id="detailsModal"
>

  <div class="modal-box">

    <button
      class="close"
      type="button"
      onclick="closeModal('detailsModal')"
    >
      ×
    </button>

    <h2
      class="modal-title"
      id="detailName"
    ></h2>

    <img
      id="detailMainImage"
      class="detail-main-image"
      src=""
      alt="Product"
    >

    <div
      id="detailThumbs"
      class="thumbnails"
    ></div>

    <div
      id="detailCategory"
      class="product-category"
      style="margin-top:12px;"
    ></div>

    <div
      id="detailSubcategory"
      class="product-subcategory"
    ></div>

    <h3
      id="detailPrice"
      class="price"
      style="margin-top:10px;"
    ></h3>

    <div style="display:grid;gap:8px;">

      <button
        class="btn btn-primary"
        type="button"
        id="detailCartBtn"
      >
        🛒 Add to Cart
      </button>

      <button
        class="btn btn-green"
        type="button"
        id="detailOrderBtn"
      >
        ⚡ Order Now
      </button>

      <button
        class="btn btn-light"
        type="button"
        id="detailShareBtn"
      >
        🔗 Share Product
      </button>

      <button
        class="btn btn-light"
        type="button"
        id="detailResellBtn"
      >
        🤝 Resell This Product
      </button>

    </div>

  </div>

</div>


<!-- CART MODAL -->

<div
  class="modal"
  id="cartModal"
>

  <div class="modal-box">

    <button
      class="close"
      type="button"
      onclick="closeModal('cartModal')"
    >
      ×
    </button>

    <h2 class="modal-title">
      🛒 Your Cart
    </h2>

    <div id="cartItems"></div>

    <div id="cartTotal"></div>

    <button
      class="btn btn-primary full-btn"
      type="button"
      style="margin-top:12px;"
      onclick="openOrderFromCart()"
    >
      Checkout / Order
    </button>

  </div>

</div>


<!-- WISHLIST MODAL -->

<div
  class="modal"
  id="wishlistModal"
>

  <div class="modal-box">

    <button
      class="close"
      type="button"
      onclick="closeModal('wishlistModal')"
    >
      ×
    </button>

    <h2 class="modal-title">
      ❤️ Wishlist
    </h2>

    <div id="wishlistItems"></div>

  </div>

</div>


<!-- ORDER MODAL -->

<div
  class="modal"
  id="orderModal"
>

  <div class="modal-box">

    <button
      class="close"
      type="button"
      onclick="closeModal('orderModal')"
    >
      ×
    </button>

    <h2 class="modal-title">
      📦 Order
    </h2>

    <div id="orderProductInfo"></div>


    <div class="form-group">

      <label>নাম</label>

      <input
        id="customerName"
        type="text"
        placeholder="আপনার নাম"
      >

    </div>


    <div class="form-group">

      <label>ফোন নম্বর</label>

      <input
        id="customerPhone"
        type="tel"
        placeholder="01XXXXXXXXX"
      >

    </div>


    <div class="form-group">

      <label>ঠিকানা</label>

      <textarea
        id="customerAddress"
        placeholder="সম্পূর্ণ ঠিকানা"
      ></textarea>

    </div>


    <div class="form-group">

      <label>Delivery Area</label>

      <select
        id="deliveryArea"
        onchange="updateOrderTotal()"
      >

        <option value="60">
          Inside Dhaka — ৳60
        </option>

        <option value="120">
          Outside Dhaka — ৳120
        </option>

      </select>

    </div>


    <div
      id="orderTotal"
      class="total-box"
    ></div>


    <button
      class="btn btn-green full-btn"
      type="button"
      onclick="sendWhatsAppOrder()"
    >
      📱 WhatsApp এ Order করুন
    </button>

  </div>

</div>


<!-- SHARE MODAL -->

<div
  class="modal"
  id="shareModal"
>

  <div class="modal-box">

    <button
      class="close"
      type="button"
      onclick="closeModal('shareModal')"
    >
      ×
    </button>

    <h2 class="modal-title">
      🔗 Share Product
    </h2>


    <div class="form-group">

      <input
        id="shareLink"
        type="text"
        readonly
      >

    </div>


    <div class="share-buttons">

      <button
        class="share-btn whatsapp"
        type="button"
        onclick="shareWhatsApp()"
      >
        💚 Share on WhatsApp
      </button>

      <button
        class="share-btn facebook"
        type="button"
        onclick="shareFacebook()"
      >
        💙 Share on Facebook
      </button>

      <button
        class="share-btn copy"
        type="button"
        onclick="copyProductLink()"
      >
        📋 Copy Product Link
      </button>

    </div>

  </div>

</div>

/* ============================= */
/* IMAGE FUNCTIONS */
/* ============================= */

function getProductImages(product){

  if(!product)
    return [];

  let imgs =
    product.images;


  if(Array.isArray(imgs)){

    return imgs.filter(Boolean);

  }


  if(typeof imgs === "string"){

    try{

      const parsed =
        JSON.parse(imgs);


      if(Array.isArray(parsed)){

        return parsed.filter(Boolean);

      }


      if(
        parsed &&
        Array.isArray(parsed.urls)
      ){

        return parsed.urls.filter(Boolean);

      }

    }catch(e){}


    if(imgs.trim()){

      return [
        imgs.trim()
      ];

    }

  }


  if(
    imgs &&
    typeof imgs === "object"
  ){

    if(
      Array.isArray(imgs.urls)
    ){

      return imgs.urls.filter(Boolean);

    }

  }


  return [];

}


function getProductImage(product){

  const images =
    getProductImages(product);


  return images.length
    ? images[0]
    : "https://via.placeholder.com/500x500?text=Gadhuli";

}


/* ============================= */
/* ESCAPE HTML */
/* ============================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function getFilteredProducts(){

      .toLowerCase()
      .trim();


  return products.filter(
    product => {

      const productName =
        String(
          product.name || ""
        )
        .toLowerCase();


      const category =
        String(
          product.category || "Others"
        );


      const subcategory =
        String(
          product.subcategory || ""
        );


      const searchText =
        (
          productName +
          " " +
          category +
          " " +
          subcategory
        )
        .toLowerCase();


      const categoryMatch =
        !currentCategory ||
        category === currentCategory;


      const subcategoryMatch =
        !currentSubcategory ||
        currentSubcategory === "All" ||
        subcategory === currentSubcategory;


      const searchMatch =
        !query ||
        searchText.includes(query);


      return (
        categoryMatch &&
        subcategoryMatch &&
        searchMatch
      );

    }
  );

}

/* ============================= */
/* IMAGE SWIPE */
/* ============================= */

let touchStartX = 0;


function sliderTouchStart(event){

  touchStartX =
    event.changedTouches[0]
      .screenX;

}


function sliderTouchEnd(event){

  const touchEndX =
    event.changedTouches[0]
      .screenX;


  const difference =
    touchStartX -
    touchEndX;


  if(
    Math.abs(difference) < 40
  )
    return;


  const box =
    event.currentTarget;


  const productId =
    box.getAttribute(
      "data-product-id"
    );


  if(difference > 0){

    changeCardImage(
      productId,
      1
    );

  }else{

    changeCardImage(
      productId,
      -1
    );

  }

}


function changeCardImage(
  productId,
  direction
){

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );


  if(!product)
    return;


  const images =
    getProductImages(
      product
    );


  if(images.length <= 1)
    return;


  const boxes =
    document.querySelectorAll(
      ".product-image-box"
    );


  let box = null;


  boxes.forEach(
    item => {

      if(
        String(
          item.getAttribute(
            "data-product-id"
          )
        ) ===
        String(productId)
      ){

        box = item;

      }

    }
  );


  if(!box)
    return;


  let index =
    Number(
      box.getAttribute(
        "data-index"
      ) || 0
    );


  index += direction;


  if(index < 0)
    index =
      images.length - 1;


  if(index >= images.length)
    index = 0;


  box.setAttribute(
    "data-index",
    index
  );


  const img =
    document.getElementById(
      "card-img-" +
      String(productId)
    );


  if(img){

    img.src =
      images[index];


    img.onerror =
      function(){

        this.src =
          "https://via.placeholder.com/500x500?text=Gadhuli";

      };

  }


  const counter =
    document.getElementById(
      "counter-" +
      String(productId)
    );


  if(counter){

    counter.textContent =
      `${index+1}/${images.length}`;

  }


  const dots =
    document.querySelectorAll(
      "#dots-" +
      CSS.escape(
        String(productId)
      ) +
      " .slider-dot"
    );


  dots.forEach(
    (dot,i) => {

      dot.classList.toggle(
        "active",
        i === index
      );

    }
  );

}

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );


  if(!product)
    return;


  currentShareProduct =
    product;


  const link =
    window.location.origin +
    window.location.pathname +
    "?product=" +
    encodeURIComponent(
      product.id
    );


  document.getElementById(
    "shareLink"
  ).value =
    link;


  document.getElementById(
    "shareModal"
  ).style.display =
    "block";

}

  const product =

async function copyProductLink(){

  const link =
    document.getElementById(
      "shareLink"
    ).value;


  try{

    await navigator.clipboard.writeText(
      link
    );


    alert(
      "Product link copied ✅"
    );

  }catch(e){

    alert(
      "Link: " +
      link
    );

  }

}


/* ============================= */
/* RESELL */
/* ============================= */

function resellProduct(
  productId
){

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );


  if(!product)
    return;


  const link =
    window.location.origin +
    window.location.pathname +
    "?product=" +
    encodeURIComponent(
      product.id
    ) +
    "&ref=RESELLER";


  const message =
    `🤝 I want to resell this product.%0A%0A` +
    `${product.name}%0A` +
    `Price: ৳${Number(
      product.price || 0
    )}%0A%0A` +
    link;


  if(navigator.share){

    navigator.share({

      title:
        product.name,

      text:
        `Resell this product: ${product.name}`,

      url:
        link

    }).catch(
      ()=>{}
    );

  }else{

    window.open(
      "https://wa.me/?text=" +
      message,
      "_blank"
    );

  }

}


/* ============================= */
/* URL PRODUCT */
/* ============================= */

function openProductFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const productId =
    params.get(
      "product"
    );


  if(productId){

    const product =
      products.find(
        p =>
          String(p.id) ===
          String(productId)
      );


    if(product){

      setTimeout(
        () =>
          openDetails(
            product.id
          ),
        300
      );

    }

  }

}


/* ============================= */
/* CLOSE MODALS */
/* ============================= */

function closeModal(id){

  document.getElementById(
    id
  ).style.display =
    "none";

}


window.addEventListener(
  "click",
  function(event){

    document
      .querySelectorAll(".modal")
      .forEach(
        modal => {

          if(
            event.target ===
            modal
          ){

            modal.style.display =
              "none";

          }

        }
      );

  }
);
