<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

content="lkVxExaUcJinZDbyNwrJL4Jhc3kjkYTwQXLFYYKu_p8">

<title>Gadhuli | Official Website</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#333;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #f8c9d8;
  padding:10px 15px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  height:45px;
  width:auto;
  object-fit:contain;
}

.search-box{
  flex:1;
  position:relative;
}

.search-box input{
  width:100%;
  padding:12px 16px;
  border:1px solid #f3b6c9;
  border-radius:25px;
  outline:none;
  font-size:15px;
}

.search-box input:focus{
  border-color:#ec407a;
}

.header-btns{
  display:flex;
  gap:7px;
}

.icon-btn{
  border:0;
  background:#fce4ec;
  color:#e91e63;
  padding:10px 12px;
  border-radius:20px;
  cursor:pointer;
  font-size:17px;
}

.hero{
  max-width:1200px;
  margin:18px auto;
  padding:35px 20px;
  text-align:center;
  border-radius:20px;
  background:linear-gradient(135deg,#f8bbd0,#f48fb1);
  color:#fff;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  font-size:16px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:10px 15px 40px;
}

.section-title{
  font-size:24px;
  color:#e91e63;
  margin:15px 0;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:16px;
}

.product-card{
  background:#fff;
  border:1px solid #f8d2df;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(233,30,99,.08);
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
}

.product-image-box{
  position:relative;
  width:100%;
  height:230px;
  background:#fce4ec;
  overflow:hidden;
  touch-action:pan-y;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.image-counter{
  position:absolute;
  top:9px;
  right:9px;
  background:rgba(0,0,0,.55);
  color:#fff;
  padding:4px 8px;
  border-radius:15px;
  font-size:12px;
}

.slider-dots{
  position:absolute;
  bottom:8px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:5px;
}

.slider-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  opacity:.55;
}

.slider-dot.active{
  opacity:1;
  transform:scale(1.2);
}

.product-info{
  padding:13px;
}

.product-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:7px;
}

.price{
  color:#e91e63;
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
}

.card-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 8px;
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
}

.btn-primary{
  background:#ec407a;
  color:#fff;
}

.btn-light{
  background:#fce4ec;
  color:#d81b60;
}

.btn-green{
  background:#25d366;
  color:#fff;
}

.full-btn{
  grid-column:1/-1;
}

.empty{
  text-align:center;
  padding:50px 15px;
  color:#999;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.55);
  padding:20px;
  overflow:auto;
}

.modal-box{
  background:#fff;
  max-width:600px;
  margin:30px auto;
  border-radius:18px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  top:10px;
  right:14px;
  border:0;
  background:#fce4ec;
  color:#e91e63;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.modal-title{
  color:#e91e63;
  margin-bottom:15px;
  padding-right:40px;
}

.detail-main-image{
  width:100%;
  height:320px;
  object-fit:contain;
  background:#fff7fa;
  border-radius:12px;
}

.thumbnails{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-top:10px;
}

.thumb{
  width:65px;
  height:65px;
  object-fit:cover;
  border:2px solid transparent;
  border-radius:8px;
  cursor:pointer;
}

.thumb.active{
  border-color:#ec407a;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:11px;
  border:1px solid #f3b6c9;
  border-radius:9px;
  outline:none;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.cart-item{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #f4d5df;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
}

.cart-info{
  flex:1;
}

.total-box{
  margin-top:15px;
  padding:15px;
  background:#fff7fa;
  border-radius:10px;
}

.share-buttons{
  display:grid;
  gap:10px;
  margin-top:15px;
}

.share-btn{
  padding:12px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.facebook{
  background:#1877f2;
  color:#fff;
}

.whatsapp{
  background:#25d366;
  color:#fff;
}

.copy{
  background:#fce4ec;
  color:#d81b60;
}

.loading{
  text-align:center;
  padding:40px;
  color:#e91e63;
}

@media(max-width:600px){
  .header-inner{
    flex-wrap:wrap;
  }

  .search-box{
    order:3;
    flex-basis:100%;
  }

  .logo{
    max-width:130px;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-image-box{
    height:180px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .btn{
    font-size:11px;
    padding:9px 5px;
  }

  .hero h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <img src="logo.png" class="logo" alt="Gadhuli">

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔎 Product খুঁজুন..."
        oninput="searchProducts()">
    </div>

    <div class="header-btns">
      <button class="icon-btn" onclick="openWishlist()">❤️</button>
      <button class="icon-btn" onclick="openCart()">🛒</button>
    </div>

  </div>
</header>

<section class="hero">
  <h1>Gadhuli</h1>
  <p>Shop Smart. Shop Easy. 🌸</p>
</section>

<main class="container">

  <h2 class="section-title">🛍️ Our Products</h2>

  <div id="productGrid" class="product-grid">
    <div class="loading">Products loading... ⏳</div>
  </div>

</main>


<!-- DETAILS MODAL -->
<div class="modal" id="detailsModal">
  <div class="modal-box">

    <button class="close" onclick="closeModal('detailsModal')">×</button>

    <h2 class="modal-title" id="detailName"></h2>

    <img
      id="detailMainImage"
      class="detail-main-image"
      src=""
      alt="Product">

    <div id="detailThumbs" class="thumbnails"></div>

    <h3 id="detailPrice" class="price" style="margin-top:15px;"></h3>

    <div style="display:grid;gap:8px;">
      <button class="btn btn-primary"
        id="detailCartBtn">
        🛒 Add to Cart
      </button>

      <button class="btn btn-green"
        id="detailOrderBtn">
        ⚡ Order Now
      </button>

      <button class="btn btn-light"
        id="detailShareBtn">
        🔗 Share Product
      </button>

      <button class="btn btn-light"
        id="detailResellBtn">
        🤝 Resell This Product
      </button>
    </div>

  </div>
</div>


<!-- CART MODAL -->
<div class="modal" id="cartModal">
  <div class="modal-box">

    <button class="close" onclick="closeModal('cartModal')">×</button>

    <h2 class="modal-title">🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <div id="cartTotal"></div>

    <button
      class="btn btn-primary full-btn"
      style="margin-top:12px;"
      onclick="openOrderFromCart()">
      Checkout / Order
    </button>

  </div>
</div>


<!-- WISHLIST MODAL -->
<div class="modal" id="wishlistModal">
  <div class="modal-box">

    <button class="close" onclick="closeModal('wishlistModal')">×</button>

    <h2 class="modal-title">❤️ Wishlist</h2>

    <div id="wishlistItems"></div>

  </div>
</div>


<!-- ORDER MODAL -->
<div class="modal" id="orderModal">
  <div class="modal-box">

    <button class="close" onclick="closeModal('orderModal')">×</button>

    <div class="form-group">

      <label>ফোন নম্বর</label>
      <input id="customerPhone" type="tel" placeholder="01XXXXXXXXX">
    </div>

      <label>ঠিকানা</label>

        placeholder="সম্পূর্ণ ঠিকানা"></textarea>
    </div>

    <div class="form-group">
      <label>Delivery Area</label>
      <select id="deliveryArea" onchange="updateOrderTotal()">
        <option value="60">Inside Dhaka — ৳60</option>
        <option value="120">Outside Dhaka — ৳120</option>
      </select>

    <div id="orderTotal" class="total-box"></div>

    <button

      onclick="sendWhatsAppOrder()">
      📱 WhatsApp এ Order করুন

</div>


<!-- SHARE MODAL -->
<div class="modal" id="shareModal">
  <div class="modal-box">

    <button class="close" onclick="closeModal('shareModal')">×</button>

    <h2 class="modal-title">🔗 Share Product</h2>

    <div class="form-group">
      <input id="shareLink" type="text" readonly>
    </div>

    <div class="share-buttons">

      <button class="share-btn whatsapp"
        onclick="shareWhatsApp()">
        💚 Share on WhatsApp
      </button>

      <button class="share-btn facebook"
        onclick="shareFacebook()">
        💙 Share on Facebook
      </button>

      <button class="share-btn copy"
        onclick="copyProductLink()">
        📋 Copy Product Link
      </button>

    </div>

  </div>
</div>


<script>

const db = window.gadhuliSupabase;

let products = [];
let cart = JSON.parse(localStorage.getItem("gadhuli_cart") || "[]");
let wishlist = JSON.parse(localStorage.getItem("gadhuli_wishlist") || "[]");

let currentOrderProducts = [];
let currentDetailProduct = null;
let currentShareProduct = null;


/* =========================
   PRODUCT IMAGE FUNCTIONS
========================= */

function getProductImages(product){

  if(!product) return [];

  let imgs = product.images;

  if(Array.isArray(imgs)){
    return imgs.filter(Boolean);
  }

  if(typeof imgs === "string"){

    try{
      const parsed = JSON.parse(imgs);

      if(Array.isArray(parsed)){
        return parsed.filter(Boolean);
      }

      if(parsed && Array.isArray(parsed.urls)){
        return parsed.urls.filter(Boolean);
      }

    }catch(e){}

    if(imgs.trim()){
      return [imgs.trim()];
    }
  }

  if(imgs && typeof imgs === "object"){

    if(Array.isArray(imgs.urls)){
      return imgs.urls.filter(Boolean);
    }
  }

  return [];
}


function getProductImage(product){

  const images = getProductImages(product);

  return images.length
    ? images[0]
    : "https://via.placeholder.com/500x500?text=Gadhuli";
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const grid = document.getElementById("productGrid");

  grid.innerHTML =
    '<div class="loading">Products loading... ⏳</div>';

  const { data, error } = await db
    .from("products")
    .select("*")
    .order("id",{ascending:false});

  if(error){

    console.error(error);

    grid.innerHTML =
      '<div class="empty">Products load হয়নি ❌</div>';

    return;
  }

  products = data || [];

  renderProducts();

  openProductFromURL();
}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(list = products){

  const grid = document.getElementById("productGrid");

  if(!list.length){

    grid.innerHTML =
      '<div class="empty">কোনো Product পাওয়া যায়নি 😔</div>';

    return;
  }

  grid.innerHTML = list.map(product => {

    const images = getProductImages(product);

    const firstImage = images.length
      ? images[0]
      : "https://via.placeholder.com/500x500?text=Gadhuli";

    const count = images.length || 1;

    const id = String(product.id);

    return `

      <div class="product-card">

        <div
          class="product-image-box"
          data-product-id="${escapeHTML(id)}"
          data-index="0"
          ontouchstart="sliderTouchStart(event)"
          ontouchend="sliderTouchEnd(event)"
        >

          <img
            class="product-image"
            id="card-img-${escapeHTML(id)}"
            src="${escapeHTML(firstImage)}"
            alt="${escapeHTML(product.name)}"
            onclick="openDetails('${escapeHTML(id)}')"
            onerror="this.src='https://via.placeholder.com/500x500?text=Gadhuli'"
          >

          <div
            class="image-counter"
            id="counter-${escapeHTML(id)}">
            1/${count}
          </div>

          <div
            class="slider-dots"
            id="dots-${escapeHTML(id)}">

            ${images.map((img,index)=>`
              <span
                class="slider-dot ${index===0?'active':''}">
              </span>
            `).join("")}

          </div>

        </div>

        <div class="product-info">

          <div class="product-name">
            ${escapeHTML(product.name)}
          </div>

          <div class="price">
            ৳${Number(product.price || 0)}
          </div>

          <div class="card-actions">

            <button
              class="btn btn-primary"
              onclick="addToCart('${escapeHTML(id)}')">
              🛒 Cart
            </button>

            <button
              class="btn btn-light"
              onclick="toggleWishlist('${escapeHTML(id)}')">
              ❤️
            </button>

            <button
              class="btn btn-green"
              onclick="orderNow('${escapeHTML(id)}')">
              ⚡ Order
            </button>

            <button
              class="btn btn-light"
              onclick="openShare('${escapeHTML(id)}')">
              🔗 Share
            </button>

            <button
              class="btn btn-light full-btn"
              onclick="resellProduct('${escapeHTML(id)}')">
              🤝 Resell This Product
            </button>

            <button
              class="btn btn-light full-btn"
              onclick="openDetails('${escapeHTML(id)}')">
              👁️ Details
            </button>

          </div>

        </div>

      </div>
    `;
  }).join("");
}


/* =========================
   SLIDER
========================= */

let touchStartX = 0;


function sliderTouchStart(event){

  touchStartX = event.changedTouches[0].screenX;
}


function sliderTouchEnd(event){

  const touchEndX =
    event.changedTouches[0].screenX;

  const difference =
    touchStartX - touchEndX;

  if(Math.abs(difference) < 40) return;

  const box =
    event.currentTarget;

  const productId =
    box.getAttribute("data-product-id");

  if(difference > 0){

    changeCardImage(productId,1);

  }else{

    changeCardImage(productId,-1);

  }
}


function changeCardImage(productId,direction){

  const product =
    products.find(
      p => String(p.id) === String(productId)
    );

  if(!product) return;

  const images =
    getProductImages(product);

  if(images.length <= 1) return;

  const box =
    document.querySelector(
      `.product-image-box[data-product-id="${CSS.escape(String(productId))}"]`
    );

  if(!box) return;

  let index =
    Number(box.getAttribute("data-index") || 0);

  index += direction;

  if(index < 0)
    index = images.length - 1;

  if(index >= images.length)
    index = 0;

  box.setAttribute("data-index",index);

  const img =
    document.getElementById(
      "card-img-" + String(productId)
    );

  if(img){

    img.src = images[index];

    img.onerror = function(){
      this.src =
        "https://via.placeholder.com/500x500?text=Gadhuli";
    };
  }

  const counter =
    document.getElementById(
      "counter-" + String(productId)
    );

  if(counter){
    counter.textContent =
      `${index+1}/${images.length}`;
  }

  const dots =
    document.querySelectorAll(
      `#dots-${CSS.escape(String(productId))} .slider-dot`
    );

  dots.forEach((dot,i)=>{
    dot.classList.toggle(
      "active",
      i === index
    );
  });
}


/* =========================
   SEARCH
========================= */

function searchProducts(){

  const query =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  if(!query){

    renderProducts();
    return;
  }

  const filtered =
    products.filter(product =>
      String(product.name || "")
        .toLowerCase()
        .includes(query)
    );

  renderProducts(filtered);
}


/* =========================
   DETAILS
========================= */

function openDetails(productId){

  const product =
    products.find(
      p => String(p.id) === String(productId)
    );

  if(!product) return;

  currentDetailProduct = product;

  const images =
    getProductImages(product);

  document.getElementById("detailName")
    .textContent = product.name;

  document.getElementById("detailPrice")
    .textContent = "৳" + Number(product.price || 0);

  const main =
    document.getElementById("detailMainImage");

  main.src =
    images[0] ||
    "https://via.placeholder.com/500x500?text=Gadhuli";

  const thumbs =
    document.getElementById("detailThumbs");

  thumbs.innerHTML =
    images.map((image,index)=>`

      <img
        class="thumb ${index===0?'active':''}"
        src="${escapeHTML(image)}"
        onclick="changeDetailImage('${escapeHTML(image)}',this)"
        onerror="this.style.display='none'"
      >

    `).join("");

  document.getElementById("detailCartBtn")
    .onclick = () => addToCart(product.id);

  document.getElementById("detailOrderBtn")
    .onclick = () => orderNow(product.id);

  document.getElementById("detailShareBtn")
    .onclick = () => openShare(product.id);

  document.getElementById("detailResellBtn")
    .onclick = () => resellProduct(product.id);

  document.getElementById("detailsModal")
    .style.display = "block";
}


function changeDetailImage(image,element){

  document.getElementById("detailMainImage")
    .src = image;

  document.querySelectorAll(".thumb")
    .forEach(t => t.classList.remove("active"));

  element.classList.add("active");
}


/* =========================
   CART
========================= */

function addToCart(productId){

  cart.push(String(productId));

  localStorage.setItem(
    "gadhuli_cart",
    JSON.stringify(cart)
  );

  alert("Product Cart এ যোগ হয়েছে ✅");
}


function openCart(){

  renderCart();

  document.getElementById("cartModal")
    .style.display = "block";
}


function renderCart(){

  const container =
    document.getElementById("cartItems");

  if(!cart.length){

    container.innerHTML =
      '<div class="empty">Cart খালি 🛒</div>';

    document.getElementById("cartTotal")
      .innerHTML = "";

    return;
  }

  let total = 0;

  container.innerHTML =
    cart.map((id,index)=>{

      const product =
        products.find(
          p => String(p.id) === String(id)
        );

      if(!product) return "";

      total += Number(product.price || 0);

      return `

        <div class="cart-item">

          <img
            src="${escapeHTML(getProductImage(product))}"
            onerror="this.src='https://via.placeholder.com/100?text=Gadhuli'">

          <div class="cart-info">

            <b>${escapeHTML(product.name)}</b>

            <div class="price">
              ৳${Number(product.price || 0)}
            </div>

          </div>

          <button
            class="btn btn-light"
            onclick="removeCartItem(${index})">
            ❌
          </button>

        </div>

      `;

    }).join("");

  document.getElementById("cartTotal")
    .innerHTML = `
      <div class="total-box">
        <b>Subtotal: ৳${total}</b>
      </div>
    `;
}


function removeCartItem(index){

  cart.splice(index,1);

  localStorage.setItem(
    "gadhuli_cart",
    JSON.stringify(cart)
  );

  renderCart();
}


function openOrderFromCart(){

  if(!cart.length){

    alert("Cart খালি ❌");
    return;
  }

  currentOrderProducts =
    cart.map(id =>
      products.find(
        p => String(p.id) === String(id)
      )
    ).filter(Boolean);

  document.getElementById("cartModal")
    .style.display = "none";

  showOrderModal();
}


/* =========================
   ORDER NOW
========================= */

function orderNow(productId){

  const product =
    products.find(
      p => String(p.id) === String(productId)
    );

  if(!product) return;

  currentOrderProducts = [product];

  showOrderModal();
}


function showOrderModal(){

  const info =
    document.getElementById("orderProductInfo");

  info.innerHTML =
    currentOrderProducts.map(product =>`

      <div class="cart-item">

        <img
          src="${escapeHTML(getProductImage(product))}">

        <div class="cart-info">
          <b>${escapeHTML(product.name)}</b>
          <div class="price">
            ৳${Number(product.price || 0)}
          </div>
        </div>

      </div>

    `).join("");

  updateOrderTotal();

  document.getElementById("orderModal")
    .style.display = "block";
}


function updateOrderTotal(){

  const subtotal =
    currentOrderProducts.reduce(
      (sum,p)=>sum + Number(p.price || 0),
      0
    );

  const delivery =
    Number(
      document.getElementById("deliveryArea").value || 60
    );

  const total =
    subtotal + delivery;

  document.getElementById("orderTotal")
    .innerHTML = `
      <div>Subtotal: ৳${subtotal}</div>
      <div>Delivery: ৳${delivery}</div>
      <hr style="margin:8px 0">
      <strong>Total: ৳${total}</strong>
    `;
}


/* =========================
   WHATSAPP ORDER
========================= */

function sendWhatsAppOrder(){

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const delivery =
    Number(
      document.getElementById("deliveryArea").value || 60
    );

  if(!name || !phone || !address){

    alert("সব তথ্য পূরণ করুন ❌");
    return;
  }

  const subtotal =
    currentOrderProducts.reduce(
      (sum,p)=>sum + Number(p.price || 0),
      0
    );

  const total =
    subtotal + delivery;

  let message =
    "🛍️ *Gadhuli Order*%0A%0A";

  message +=
    "👤 Name: " +
    encodeURIComponent(name) +
    "%0A";

  message +=
    "📱 Phone: " +
    encodeURIComponent(phone) +
    "%0A";

  message +=
    "📍 Address: " +
    encodeURIComponent(address) +
    "%0A%0A";

  message += "🛒 Products:%0A";

  currentOrderProducts.forEach((product,i)=>{

    message +=
      `${i+1}. ${encodeURIComponent(product.name)} - ৳${Number(product.price || 0)}%0A`;

  });

  message +=
    "%0A💰 Subtotal: ৳" + subtotal;

  message +=
    "%0A🚚 Delivery: ৳" + delivery;

  message +=
    "%0A💵 *Total: ৳" + total + "*";

  const whatsappNumber =
    "8801333088194";

  const url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    message;

  window.open(url,"_blank");
}


/* =========================
   WISHLIST
========================= */

function toggleWishlist(productId){

  const id = String(productId);

  const index =
    wishlist.indexOf(id);

  if(index >= 0){

    wishlist.splice(index,1);

    alert("Wishlist থেকে remove হয়েছে");

  }else{

    wishlist.push(id);

    alert("Wishlist এ যোগ হয়েছে ❤️");
  }

  localStorage.setItem(
    "gadhuli_wishlist",
    JSON.stringify(wishlist)
  );
}


function openWishlist(){

  const container =
    document.getElementById("wishlistItems");

  const items =
    wishlist.map(id =>
      products.find(
        p => String(p.id) === String(id)
      )
    ).filter(Boolean);

  if(!items.length){

    container.innerHTML =
      '<div class="empty">Wishlist খালি ❤️</div>';

  }else{

    container.innerHTML =
      items.map(product=>`

        <div class="cart-item">

          <img
            src="${escapeHTML(getProductImage(product))}">

          <div class="cart-info">

            <b>${escapeHTML(product.name)}</b>

            <div class="price">
              ৳${Number(product.price || 0)}
            </div>

          </div>

          <button
            class="btn btn-primary"
            onclick="openDetails('${escapeHTML(product.id)}')">
            View
          </button>

        </div>

      `).join("");
  }

  document.getElementById("wishlistModal")
    .style.display = "block";
}


/* =========================
   SHARE PRODUCT
========================= */

function openShare(productId){

  const product =
    products.find(
      p => String(p.id) === String(productId)
    );

  if(!product) return;

  currentShareProduct = product;

  const link =
    window.location.origin +
    window.location.pathname +
    "?product=" +
    encodeURIComponent(product.id);

  document.getElementById("shareLink")
    .value = link;

  document.getElementById("shareModal")
    .style.display = "block";
}


function shareWhatsApp(){

  const link =
    document.getElementById("shareLink").value;

  const product =
    currentShareProduct;

  const text =
    `🛍️ ${product.name}%0A💰 ৳${Number(product.price || 0)}%0A%0A${link}`;

  window.open(
    "https://wa.me/?text=" + text,
    "_blank"
  );
}


function shareFacebook(){

  const link =
    document.getElementById("shareLink").value;

  window.open(
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(link),
    "_blank"
  );
}


async function copyProductLink(){

  const link =
    document.getElementById("shareLink").value;

  try{

    await navigator.clipboard.writeText(link);

    alert("Product link copied ✅");

  }catch(e){

    alert("Link: " + link);
  }
}


/* =========================
   RESELL
========================= */

function resellProduct(productId){

  const product =
    products.find(
      p => String(p.id) === String(productId)
    );

  if(!product) return;

  const link =
    window.location.origin +
    window.location.pathname +
    "?product=" +
    encodeURIComponent(product.id) +
    "&ref=RESELLER";

  const message =
    `🤝 I want to resell this product.%0A%0A` +
    `${product.name}%0A` +
    `Price: ৳${Number(product.price || 0)}%0A%0A` +
    link;

  if(navigator.share){

    navigator.share({
      title: product.name,
      text:
        `Resell this product: ${product.name}`,
      url: link
    }).catch(()=>{});

  }else{

    window.open(
      "https://wa.me/?text=" +
      message,
      "_blank"
    );
  }
}


/* =========================
   URL PRODUCT
========================= */

function openProductFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const productId =
    params.get("product");

  if(productId){

    const product =
      products.find(
        p => String(p.id) === String(productId)
      );

    if(product){

      setTimeout(()=>{
        openDetails(product.id);
      },300);

    }
  }
}


/* =========================
   MODAL
========================= */

function closeModal(id){

  document.getElementById(id)
    .style.display = "none";
}


window.addEventListener("click",function(event){

  document.querySelectorAll(".modal")
    .forEach(modal=>{

      if(event.target === modal){
        modal.style.display = "none";
      }

    });

});

document.addEventListener(

  loadProducts
);
